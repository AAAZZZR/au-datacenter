<!doctype html>
<html lang="zh-Hant-TW" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>澳洲可租資料中心地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css" integrity="sha512-ENrTWqddXrLJsQS2A86QmvA17PkJ0GVm1bqj5aTgpeMAfDKN2+SIOLpKG8R/6KkimnhTb+VW5qqUHB/r1zaRgg==" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
/* =========================================================
   設計 token：頁面上所有顏色都從這裡取
   ========================================================= */
:root {
  color-scheme: light;
  --bg: #E6E9E9;
  --surface: #F5F7F7;
  --surface-2: #DDE2E2;
  --ink: #101619;
  --ink-2: #4E5C61;
  --ink-3: #7C8A8F;
  --line: #C4CCCD;
  --accent: #1E5B7B;
  --on-accent: #F5F7F7;
  --warn: #8F6206;
  --shadow: 0 6px 20px rgba(16, 22, 25, 0.16);
  --st-under_construction: #17624A;
  --st-approved_not_started: #8F6206;
  --st-recently_completed: #1E5B7B;
  --st-operating_with_spare: #6A4C93;
  --st-planned_filed: #5C6B77;
  --c: var(--ink-3);
  --radius: 2px;
  --font-display: "Archivo", "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  --font-body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, "Noto Sans TC", "Microsoft JhengHei", monospace;
  --strip-h: 136px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0E1417;
    --surface: #161E22;
    --surface-2: #1E282D;
    --ink: #E3EAEC;
    --ink-2: #9DACB2;
    --ink-3: #6E7D84;
    --line: #27343A;
    --accent: #74B4D6;
    --on-accent: #0E1417;
    --warn: #D6A63C;
    --shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
    --st-under_construction: #5FBF97;
    --st-approved_not_started: #D6A63C;
    --st-recently_completed: #74B4D6;
    --st-operating_with_spare: #B79AE0;
    --st-planned_filed: #92A3AF;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0E1417;
  --surface: #161E22;
  --surface-2: #1E282D;
  --ink: #E3EAEC;
  --ink-2: #9DACB2;
  --ink-3: #6E7D84;
  --line: #27343A;
  --accent: #74B4D6;
  --on-accent: #0E1417;
  --warn: #D6A63C;
  --shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
  --st-under_construction: #5FBF97;
  --st-approved_not_started: #D6A63C;
  --st-recently_completed: #74B4D6;
  --st-operating_with_spare: #B79AE0;
  --st-planned_filed: #92A3AF;
}

/* 狀態色：任何帶 data-status 的元素都可以用 var(--c) 取得該狀態的顏色 */
[data-status="under_construction"] { --c: var(--st-under_construction); }
[data-status="approved_not_started"] { --c: var(--st-approved_not_started); }
[data-status="recently_completed"] { --c: var(--st-recently_completed); }
[data-status="operating_with_spare"] { --c: var(--st-operating_with_spare); }
[data-status="planned_filed"] { --c: var(--st-planned_filed); }

/* =========================================================
   基礎
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.na { color: var(--ink-3); }
.visually-hidden {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip-link {
  position: absolute; left: 12px; top: 8px; z-index: 100;
  transform: translateY(-160%);
  padding: 6px 12px; border-radius: var(--radius);
  background: var(--accent); color: var(--on-accent);
}
.skip-link:focus { transform: none; }
.clip-helper { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.fatal { margin: 16px 20px; padding: 12px 14px; border: 1px solid var(--line); border-left: 3px solid var(--warn); background: var(--surface); }

/* =========================================================
   頂欄
   ========================================================= */
.topbar {
  display: flex; align-items: center; gap: 12px 28px;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.topbar__title { min-width: 0; }
.topbar h1 {
  margin: 0;
  font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.25;
  letter-spacing: 0.02em;
}
.topbar__meta { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-2); }
.topbar__meta .sep { margin: 0 7px; color: var(--ink-3); }
.figures { display: flex; margin: 0 0 0 auto; }
.figure { padding: 1px 20px; border-left: 1px solid var(--line); min-width: 0; }
.figure dt { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.figure dd {
  margin: 2px 0 0;
  font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.05;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.figure dd small { margin-left: 4px; font-family: var(--font-body); font-weight: 500; font-size: 12px; color: var(--ink-2); }
.theme-toggle { display: inline-flex; flex: none; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.theme-toggle button {
  appearance: none; border: 0; background: transparent; cursor: pointer;
  padding: 4px 10px; font-size: 12px; color: var(--ink-2);
}
.theme-toggle button + button { border-left: 1px solid var(--line); }
.theme-toggle button:hover { color: var(--ink); }
.theme-toggle button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

/* =========================================================
   篩選控制列（只在地圖＋清單區段內黏住頂端）
   ========================================================= */
.controls {
  position: sticky; top: 0; z-index: 30;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "tabs meta" "filters filters";
  padding: 0 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.state-tabs {
  grid-area: tabs;
  display: flex; gap: 2px; min-width: 0;
  overflow-x: auto; scrollbar-width: thin;
  box-shadow: inset 0 -1px 0 var(--line);
}
.state-tab {
  appearance: none; flex: none; cursor: pointer;
  display: inline-flex; align-items: baseline; gap: 6px;
  padding: 11px 10px 10px;
  border: 0; background: none; white-space: nowrap;
  font-size: 13.5px; color: var(--ink-2);
}
.state-tab:hover { color: var(--ink); }
.state-tab__code { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.02em; }
.state-tab__count { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.state-tab.is-empty .state-tab__name,
.state-tab.is-empty .state-tab__count { color: var(--ink-3); }
.state-tab[aria-pressed="true"] { color: var(--ink); font-weight: 500; box-shadow: inset 0 -2px 0 var(--accent); }
.state-tab[aria-pressed="true"] .state-tab__name { color: var(--ink); }
.state-tab[aria-pressed="true"] .state-tab__count { color: var(--accent); }
.result-meta {
  grid-area: meta;
  display: flex; align-items: center; gap: 14px;
  padding-left: 16px; white-space: nowrap;
  font-size: 12.5px; color: var(--ink-2);
  box-shadow: inset 0 -1px 0 var(--line);
}
.result-meta b { font-family: var(--font-mono); font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.filters {
  grid-area: filters;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px;
  padding: 9px 0;
}
.chip-group { display: flex; align-items: center; gap: 8px; min-width: 0; }
.chip-group__label { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  appearance: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 10px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); color: var(--ink-2);
  font-size: 12.5px; white-space: nowrap;
}
.chip:hover { color: var(--ink); border-color: var(--ink-3); }
.chip[aria-pressed="true"] {
  color: var(--ink); font-weight: 500;
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 11%, var(--surface));
  box-shadow: inset 0 0 0 1px var(--accent);
}
.chip__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.search { position: relative; display: flex; align-items: center; flex: 1 1 220px; min-width: 200px; max-width: 380px; }
.search svg { position: absolute; left: 9px; width: 14px; height: 14px; color: var(--ink-3); pointer-events: none; }
.search input {
  width: 100%; height: 30px; padding: 0 10px 0 30px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--bg); color: var(--ink);
  font: inherit; font-size: 13px;
}
.search input::placeholder { color: var(--ink-3); }
.search input:hover { border-color: var(--ink-3); }
.search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.linkish {
  appearance: none; border: 0; background: none; padding: 0; cursor: pointer;
  color: var(--accent); font-size: inherit;
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px;
}
.linkish:disabled { color: var(--ink-3); text-decoration: none; cursor: default; }

/* =========================================================
   工作區：左地圖、右清單
   ========================================================= */
.workspace {
  display: grid;
  grid-template-columns: minmax(0, 58fr) minmax(0, 42fr);
  height: calc(100vh - var(--strip-h));
  min-height: 520px;
  border-bottom: 1px solid var(--line);
}
.map-col { position: relative; isolation: isolate; min-width: 0; background: var(--surface-2); border-right: 1px solid var(--line); }
.map { position: absolute; inset: 0; z-index: 0; }
.map-notice {
  position: absolute; z-index: 1; left: 50%; bottom: 34px; transform: translateX(-50%);
  width: max-content; max-width: min(440px, calc(100% - 28px));
  padding: 10px 14px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: var(--radius);
  box-shadow: var(--shadow);
  font-size: 13px;
}
.map-notice strong { display: block; margin-bottom: 2px; }
.map-notice--fatal { top: 50%; bottom: auto; transform: translate(-50%, -50%); }
.list-col { position: relative; min-width: 0; overflow-y: auto; scrollbar-gutter: stable; padding: 14px 16px 28px; }

/* 清單分組與卡片 */
.group { margin: 0 0 18px; }
.group__head { display: flex; align-items: baseline; gap: 8px; margin: 0 2px 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.group__title { margin: 0; font-size: 13px; font-weight: 700; }
.group__code { margin-left: 4px; font-family: var(--font-mono); font-size: 11px; font-weight: 400; color: var(--ink-3); }
.group__count { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.card {
  margin-bottom: 8px; padding: 12px 14px 10px;
  background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius);
}
.card:hover, .card:focus-within { border-color: var(--ink-3); }
.card.is-selected { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.card__top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card__id { font-size: 11.5px; color: var(--ink-3); letter-spacing: 0.02em; }
.card__title { margin: 6px 0 0; font-family: var(--font-display); font-weight: 700; font-size: 16.5px; line-height: 1.3; overflow-wrap: anywhere; }
.card__operator { margin: 1px 0 0; font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 10px 0 0; font-size: 13px; }
.facts dt { font-size: 12px; line-height: 1.75; color: var(--ink-2); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.facts .sep { margin: 0 6px; color: var(--ink-3); }
/* 長文字欄位（施工證據、可租說明、差異）：卡片收合時最多三行；放得下的文字不受影響 */
.card:not(.is-expanded) .clamp {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  line-clamp: 3;
  overflow: hidden;
}
.card__more {
  appearance: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  margin: 6px 0 0; padding: 2px 0;
  border: 0; background: none;
  color: var(--accent); font-size: 12px;
}
.card__more::after {
  content: ""; width: 5px; height: 5px;
  border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
  transform: translateY(-2px) rotate(45deg);
}
.card__more[aria-expanded="true"]::after { transform: translateY(1px) rotate(-135deg); }
.card__more:hover { text-decoration: underline; text-underline-offset: 2px; }
.selectable { user-select: text; }
.mw { font-family: var(--font-mono); font-weight: 500; font-size: 14px; font-variant-numeric: tabular-nums; }
.mw-unit { margin-left: 3px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
.basis { margin-left: 8px; font-size: 12px; color: var(--ink-2); }
.tag {
  display: inline-block; margin-left: 6px; padding: 0 5px; vertical-align: 1px;
  border: 1px dashed var(--ink-3); border-radius: var(--radius);
  font-size: 11px; line-height: 1.5; color: var(--ink-2); white-space: nowrap;
}
.card__meta { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 8px 0 0; font-size: 12px; color: var(--ink-2); }
.card__conflict {
  display: flex; align-items: baseline; gap: 6px;
  margin: 8px 0 0; padding: 6px 8px;
  font-size: 12px; color: var(--ink-2);
  background: color-mix(in srgb, var(--warn) 9%, var(--surface));
  border-radius: var(--radius);
  overflow-wrap: anywhere;
}
.card__conflict b { flex: none; color: var(--warn); }
.card__conflict .clamp { min-width: 0; }
.warn-mark { flex: none; width: 9px; height: 8px; background: var(--warn); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.card__foot {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
  margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line);
}
.links { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; }
.lnk { white-space: nowrap; }
.lnk .more { margin-left: 3px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
.card__actions { display: flex; gap: 6px; margin-left: auto; }
.btn {
  appearance: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
  height: 26px; padding: 0 9px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); color: var(--ink);
  font-size: 12px; line-height: 1; white-space: nowrap;
}
.btn svg { flex: none; width: 13px; height: 13px; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { color: var(--ink-3); cursor: not-allowed; }
.btn.is-done { border-color: var(--st-under_construction); color: var(--st-under_construction); }
.btn--plain { padding: 0 8px; font-size: 11.5px; }

/* 狀態膠囊、可信度 */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 1px 8px 1px 7px;
  border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--c) 12%, transparent);
  color: var(--c);
  font-size: 12px; font-weight: 500; line-height: 1.6; white-space: nowrap;
}
.pill::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.conf { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.conf__dot { position: relative; overflow: hidden; flex: none; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--accent); }
.conf[data-conf="high"] .conf__dot { background: var(--accent); }
.conf[data-conf="medium"] .conf__dot::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 50%; background: var(--accent); }
.dash-ring { display: inline-block; flex: none; width: 11px; height: 11px; border-radius: 50%; border: 1.5px dashed var(--ink); vertical-align: -1px; }

/* 空狀態（某州沒有專案、或篩選後沒有結果） */
.empty {
  margin-bottom: 12px; padding: 16px 18px;
  background: var(--surface);
  border: 1px solid var(--line); border-left: 3px solid var(--ink-3); border-radius: var(--radius);
}
.empty__kicker { margin: 0 0 4px; font-size: 12px; color: var(--ink-2); }
.empty__title { margin: 0; font-size: 15.5px; font-weight: 700; line-height: 1.5; }
.empty__sub, .empty h4 { margin: 14px 0 4px; font-size: 12px; font-weight: 500; color: var(--ink-2); }
.empty ul { margin: 0; padding-left: 1.2em; font-size: 13px; line-height: 1.7; }
.empty p.na { margin: 0; font-size: 13px; }
.empty__actions { margin: 12px 0 0; }
.zero-note { margin: 14px 2px 0; font-size: 12.5px; line-height: 1.8; color: var(--ink-2); }

/* 觀察名單（出租性待確認）：文字徽章、卡片、篩選鈕 */
.ring-icon { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; vertical-align: -1px; }
.tier-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 0 6px; border: 1px solid var(--ink-3); border-radius: var(--radius);
  font-size: 11.5px; font-weight: 500; line-height: 1.6; color: var(--ink-2); white-space: nowrap;
}
.tier-main { font-size: 12px; color: var(--ink-2); }
.card__badges { display: inline-flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.card.is-watch { background: color-mix(in srgb, var(--surface) 55%, var(--bg)); }
.card__tier { margin: 8px 0 0; font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
.chip--watch { gap: 7px; }
.chip--watch .ring-icon { width: 11px; height: 11px; color: var(--ink-2); }
.state-tab__watch { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); }
.note-watch {
  margin: 0 2px 8px; padding: 8px 10px;
  border: 1px dashed var(--ink-3); border-radius: var(--radius);
  font-size: 12.5px; color: var(--ink-2);
}
.note-watch strong { color: var(--ink); font-weight: 700; }
.figure__note { display: block; margin-top: 3px; font-family: var(--font-body); font-weight: 500; font-size: 11.5px; line-height: 1.35; color: var(--ink-2); white-space: nowrap; word-break: keep-all; }

/* =========================================================
   Leaflet 外觀（全部改用 token）
   ========================================================= */
.leaflet-container { background: var(--surface-2); color: var(--ink); font-family: var(--font-body); font-size: 12px; }
.leaflet-container a { color: var(--accent); }
.leaflet-bar, .leaflet-touch .leaflet-bar { border: 1px solid var(--line); border-radius: var(--radius); box-shadow: none; }
.leaflet-bar a, .leaflet-touch .leaflet-bar a {
  width: 30px; height: 30px; line-height: 30px;
  background: var(--surface); color: var(--ink); border-bottom: 1px solid var(--line);
}
.leaflet-bar a:last-child { border-bottom: 0; }
.leaflet-bar a:hover, .leaflet-bar a:focus { background: var(--surface-2); color: var(--ink); }
.leaflet-bar a.leaflet-disabled { background: var(--surface); color: var(--ink-3); }
.leaflet-touch .leaflet-bar a:first-child { border-top-left-radius: var(--radius); border-top-right-radius: var(--radius); }
.leaflet-touch .leaflet-bar a:last-child { border-bottom-left-radius: var(--radius); border-bottom-right-radius: var(--radius); }
.leaflet-container .leaflet-control-attribution {
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  color: var(--ink-2); font-size: 10.5px;
}
.leaflet-container .leaflet-control-attribution a { color: var(--ink-2); }
.leaflet-popup-content-wrapper {
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.leaflet-popup-content { margin: 12px 14px; font-size: 13px; line-height: 1.5; }
.leaflet-popup-tip { background: var(--surface); box-shadow: none; border: 1px solid var(--line); }
.leaflet-popup-tip-container { margin-top: -1px; }
.leaflet-container a.leaflet-popup-close-button { width: 28px; height: 28px; font: 18px/28px var(--font-body); color: var(--ink-2); }
.leaflet-container a.leaflet-popup-close-button:hover { color: var(--ink); }
.leaflet-tooltip.dc-tip {
  padding: 3px 8px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow);
  font-size: 12px; font-weight: 500;
}
.leaflet-tooltip-top.dc-tip::before { border-top-color: var(--line); }
.leaflet-marker-icon.dc-cluster {
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: var(--surface); color: var(--ink);
  border: 2px solid var(--ink-2);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--ink-2) 22%, transparent);
  font-family: var(--font-display); font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums;
}
.leaflet-marker-icon.dc-cluster.is-hot {
  border-color: var(--accent); color: var(--accent);
  box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 38%, transparent);
}

/* 圖例 */
.legend {
  min-width: 176px; max-width: 250px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--radius);
  font-size: 12px; line-height: 1.45;
}
.legend summary {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 6px 10px; cursor: pointer; list-style: none; font-weight: 500;
}
.legend summary::-webkit-details-marker { display: none; }
.legend summary::after {
  content: ""; width: 6px; height: 6px;
  border-right: 1.5px solid var(--ink-2); border-bottom: 1.5px solid var(--ink-2);
  transform: rotate(-135deg); margin-top: 3px;
}
.legend:not([open]) { min-width: 0; }
.legend[open] summary { border-bottom: 1px solid var(--line); }
.legend[open] summary::after { transform: rotate(45deg); margin-top: -3px; }
.legend__body { padding: 8px 10px 10px; }
.legend__sub { margin: 0 0 4px; font-size: 11px; color: var(--ink-2); }
.legend__list { display: grid; gap: 3px; margin: 0 0 8px; padding: 0; list-style: none; }
.legend__list:last-child { margin-bottom: 0; }
.legend__list li { display: flex; align-items: center; gap: 7px; }
.ldot { flex: none; width: 11px; height: 11px; border-radius: 50%; background: var(--c); border: 1px solid var(--surface); }
.ldot--neutral { --c: var(--ink-2); }
.ldot--null { background: color-mix(in srgb, var(--ink-2) 40%, transparent); border: 1.5px solid var(--ink-2); width: 9px; height: 9px; }
.ldot--watch { background: color-mix(in srgb, var(--ink-2) 12%, transparent); border: 3px solid var(--ink-2); width: 13px; height: 13px; }
.ldot--approx { background: color-mix(in srgb, var(--ink-2) 60%, transparent); border: 1.5px dashed var(--ink); }
.legend__sizes { display: block; margin: 0 0 8px; }
.legend__sizes circle { fill: color-mix(in srgb, var(--ink-2) 30%, transparent); stroke: var(--ink-2); stroke-width: 1; }
.legend__sizes text { fill: var(--ink-2); font-family: var(--font-mono); font-size: 10px; }

/* 彈出視窗內容（前面加 .leaflet-popup-content，蓋過 Leaflet 對 p 的預設外距） */
.leaflet-popup-content .pop__kicker { margin: 0; font-size: 11.5px; color: var(--ink-2); }
.leaflet-popup-content .pop__title { margin: 3px 0 0; font-family: var(--font-display); font-weight: 700; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
.leaflet-popup-content .pop__operator { margin: 1px 0 8px; color: var(--ink-2); }
.pop__badges { display: flex; flex-wrap: wrap; gap: 6px; }
.leaflet-popup-content .pop__note { display: flex; align-items: center; gap: 6px; margin: 8px 0 0; font-size: 12px; color: var(--ink); }
.leaflet-popup-content .pop__tier { margin: 6px 0 0; font-size: 12px; color: var(--ink-2); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 12px; margin: 10px 0 0; }
.kv dt { font-size: 12px; color: var(--ink-2); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.kv .sub { display: block; margin-top: 1px; font-size: 12px; color: var(--ink-2); }
.leaflet-popup-content .pop__links { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 10px 0 0; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; }

/* =========================================================
   報告
   ========================================================= */
.report { max-width: 1680px; margin: 0 auto; padding: 44px 20px 56px; }
.eyebrow { margin: 0; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; color: var(--ink-2); }
.report__title { margin: 6px 0 0; font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.25; }
.report__meta { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); }
.rsec { margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--line); }
.rsec__head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 18px; }
.rsec__num { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.rsec__head h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.3; }
.lead { max-width: 62ch; margin: 0 0 16px; font-size: 19px; font-weight: 500; line-height: 1.6; }
.prose { max-width: 78ch; font-size: 15px; line-height: 1.85; }
.prose p { margin: 0 0 12px; }
.section-note { margin: 0 0 14px; max-width: 90ch; font-size: 13px; color: var(--ink-2); }
.findings { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; margin: 0; padding: 0; list-style: none; }
.finding { padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.finding__num { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.finding h3 { margin: 4px 0 6px; font-size: 15px; font-weight: 700; line-height: 1.45; }
.finding p { margin: 0; font-size: 13.5px; line-height: 1.75; color: var(--ink-2); }
.notes { max-width: 90ch; margin: 0 0 20px; padding-left: 1.2em; font-size: 14px; line-height: 1.8; }
.sub-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin: 28px 0 10px; }
.sub-head h3 { margin: 0; font-size: 16px; font-weight: 700; }
.sub-head .code { margin-left: 6px; font-family: var(--font-mono); font-size: 12px; font-weight: 400; color: var(--ink-3); }
.sub-head .stats { font-size: 12.5px; color: var(--ink-2); }
/* position: relative 讓表頭裡的 visually-hidden 文字也被裁切在捲動框內，不會撐寬整頁 */
.table-wrap { position: relative; overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.dtable { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px; line-height: 1.5; }
.dtable th {
  padding: 8px 10px; text-align: left; vertical-align: bottom;
  background: var(--surface-2); color: var(--ink-2);
  border-bottom: 1px solid var(--line);
  font-size: 12px; font-weight: 500;
}
.dtable td { padding: 9px 10px; vertical-align: top; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.dtable tbody tr:first-child td { border-top: 0; }
.dtable tbody tr:target td { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.dtable tr.is-watch td { background: color-mix(in srgb, var(--surface-2) 45%, var(--surface)); }
.dtable .sub { margin-top: 3px; font-size: 12px; color: var(--ink-2); }
.dtable .t-name { font-weight: 700; }
/* 表格裡的狀態改成「色點＋文字」，窄欄換行時比膠囊框整齊 */
.dtable .pill { display: inline; padding: 0; border: 0; background: none; white-space: normal; line-height: 1.5; }
.dtable .pill::before { display: inline-block; margin-right: 6px; vertical-align: 1px; }
.nowrap { white-space: nowrap; }
.src { display: block; text-decoration: none; }
.src__label { display: block; font-size: 12px; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
.src:hover .src__label { text-decoration-thickness: 2px; }
.src__host { display: block; font-family: var(--font-mono); font-size: 11px; line-height: 1.4; color: var(--ink-2); }
.dtable .tier-badge { margin-top: 4px; }
.dtable td.col-locate { padding-left: 6px; padding-right: 6px; }
.dtable--state { min-width: 1320px; }
.dtable--window { min-width: 1000px; }
.dtable--excluded { min-width: 1040px; }
.dtable--conflicts { min-width: 640px; }
.src-list { display: grid; gap: 3px; }
.conflicts { display: grid; gap: 8px; margin: 0 0 20px; padding: 0; list-style: none; }
.conflict { padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: var(--radius); }
.conflict h3 { margin: 0 0 4px; font-size: 14.5px; }
.conflict p { margin: 0; font-size: 13.5px; line-height: 1.75; }
.conflict .refs { margin-top: 6px; font-size: 12px; color: var(--ink-2); }
.coverage { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; }
.cov { padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.cov h3 { margin: 0; font-size: 15px; }
.cov h3 .code { margin-left: 6px; font-family: var(--font-mono); font-size: 12px; font-weight: 400; color: var(--ink-3); }
.cov__meta { margin: 2px 0 0; font-size: 12px; color: var(--ink-2); }
.cov h4 { margin: 12px 0 4px; font-size: 12px; font-weight: 500; color: var(--ink-2); }
.cov ul { margin: 0; padding-left: 1.2em; font-size: 13px; line-height: 1.7; }
.cov p.na { margin: 0; font-size: 13px; }
.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px 32px; }
.two-col h3 { margin: 0 0 6px; font-size: 15px; }
.two-col ul { margin: 0; padding-left: 1.3em; font-size: 14px; line-height: 1.8; }
.excluded summary {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  padding: 7px 12px; font-size: 13px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
}
.excluded summary:hover { border-color: var(--ink-3); }
.excluded[open] .when-closed, .excluded:not([open]) .when-open { display: none; }
.excluded[open] summary { margin-bottom: 14px; }
.reason-counts { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; padding: 0; list-style: none; }
.reason-counts li { padding: 3px 10px; font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.reason-counts b { margin-left: 6px; font-family: var(--font-mono); font-weight: 500; }
.foot { padding: 18px 20px 28px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }
/* 搜尋紀錄、缺口、敘述裡可能有很長的網址或代碼，必要時從任意位置換行，避免整頁橫向捲動 */
.lead, .prose, .finding, .notes, .conflict, .cov, .two-col, .empty, .section-note { overflow-wrap: anywhere; }

/* =========================================================
   響應式
   ========================================================= */
@media (max-width: 1279.98px) {
  .state-tab__code { display: none; }
  .figure { padding: 1px 14px; }
}
@media (max-width: 899.98px) {
  /* 窄螢幕頂欄：標題＋配色切換一列、說明一列、四個數字一列 */
  .topbar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "title toggle" "meta meta" "figures figures";
    gap: 4px 12px;
    padding: 12px 16px;
  }
  .topbar__title { display: contents; }
  .topbar h1 { grid-area: title; align-self: center; font-size: 18px; }
  .topbar__meta { grid-area: meta; margin: 0; }
  .theme-toggle { grid-area: toggle; align-self: center; }
  .figures { grid-area: figures; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 8px 0 0; }
  .figure { padding: 0 8px; }
  .figure:first-child { padding-left: 0; border-left: 0; }
  .figure dd { font-size: 20px; }
  .figure__note { white-space: normal; }
  .controls { position: static; grid-template-columns: minmax(0, 1fr); grid-template-areas: "tabs" "filters" "meta"; padding: 0 16px; }
  .filters { flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 8px; }
  .chip-group { overflow-x: auto; scrollbar-width: none; }
  .chips { flex-wrap: nowrap; }
  .search { flex: none; max-width: none; margin-left: 0; }
  .result-meta { justify-content: space-between; padding: 0 0 10px; box-shadow: none; }
  .workspace { display: block; height: auto; min-height: 0; }
  .map-col { height: 55vh; min-height: 320px; border-right: 0; border-bottom: 1px solid var(--line); }
  .list-col { overflow: visible; scrollbar-gutter: auto; padding: 14px 16px 24px; }
  .report { padding: 32px 16px 44px; }
  .report__title { font-size: 22px; }
  .lead { font-size: 17px; }
  .findings, .coverage { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
}

/* =========================================================
   列印：隱藏控制列與地圖，只印報告（A4 橫向）
   ========================================================= */
@media print {
  @page { size: A4 landscape; margin: 10mm 10mm 12mm; }
  :root, :root[data-theme] {
    color-scheme: light;
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-2: #EEF1F1;
    --ink: #101619;
    --ink-2: #4E5C61;
    --ink-3: #7C8A8F;
    --line: #C4CCCD;
    --accent: #1E5B7B;
    --on-accent: #F5F7F7;
    --warn: #8F6206;
    --shadow: none;
    --st-under_construction: #17624A;
    --st-approved_not_started: #8F6206;
    --st-recently_completed: #1E5B7B;
    --st-operating_with_spare: #6A4C93;
    --st-planned_filed: #5C6B77;
  }
  /* 色點、狀態色、表頭底色都要印出來 */
  body { font-size: 10pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .skip-link, .theme-toggle, .desk, .col-locate, .excluded summary { display: none !important; }
  .topbar { padding: 0 0 8px; }
  .report { max-width: none; padding: 10px 0 0; }
  .rsec { margin-top: 18px; padding-top: 12px; }
  .rsec__head, .sub-head, h2, h3 { break-after: avoid; }
  .finding, .cov, .conflict, .empty { break-inside: avoid; }
  .table-wrap { overflow: visible; border: 0; }
  .dtable { min-width: 0 !important; font-size: 8pt; }
  .dtable th, .dtable td { padding: 4px 5px; }
  .dtable tr { break-inside: avoid; }
  a { color: var(--ink); text-decoration: none; }
  .foot { padding: 8px 0 0; border: 0; }
}
</style>
</head>
<body>
<a class="skip-link" href="#report">跳到報告</a>

<header class="topbar">
  <div class="topbar__title">
    <h1>澳洲可租資料中心地圖</h1>
    <p class="topbar__meta" id="topbar-meta"></p>
  </div>
  <dl class="figures" id="figures" aria-label="總覽數字"></dl>
  <div class="theme-toggle" id="theme-toggle" role="group" aria-label="配色模式">
    <button type="button" data-theme-choice="auto" aria-pressed="true">自動</button>
    <button type="button" data-theme-choice="light" aria-pressed="false">淺色</button>
    <button type="button" data-theme-choice="dark" aria-pressed="false">深色</button>
  </div>
</header>

<main id="main">
  <noscript><p class="fatal">此頁需要啟用 JavaScript 才能顯示地圖、專案清單與報告。</p></noscript>

  <section class="desk" id="desk" aria-label="地圖與專案清單">
    <div class="controls" id="controls">
      <div class="state-tabs" id="state-tabs" role="group" aria-label="州別"></div>
      <div class="filters">
        <div class="chip-group" role="group" aria-labelledby="lbl-status">
          <span class="chip-group__label" id="lbl-status">狀態</span>
          <div class="chips" id="status-chips"></div>
        </div>
        <div class="chip-group" role="group" aria-labelledby="lbl-window">
          <span class="chip-group__label" id="lbl-window">完工時間窗</span>
          <div class="chips" id="window-chips"></div>
        </div>
        <div class="chip-group" role="group" aria-label="分級">
          <button type="button" class="chip chip--watch" id="watch-chip" aria-pressed="true"><span class="ring-icon" aria-hidden="true"></span>含觀察名單</button>
        </div>
        <label class="search">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span class="visually-hidden">搜尋專案、營運商、地址、郊區</span>
          <input type="search" id="search" placeholder="搜尋專案、營運商、地址、郊區" autocomplete="off" spellcheck="false">
        </label>
      </div>
      <div class="result-meta">
        <output id="result-count" aria-live="polite"></output>
        <button type="button" class="linkish" id="reset-filters">重設篩選</button>
      </div>
    </div>

    <div class="workspace">
      <div class="map-col" id="map-col">
        <div class="map" id="map" role="region" aria-label="專案地圖"></div>
        <div class="map-notice" id="map-notice" role="status" hidden></div>
      </div>
      <div class="list-col" id="list-col">
        <h2 class="visually-hidden">專案清單</h2>
        <div id="list"></div>
      </div>
    </div>
  </section>

  <article class="report" id="report" aria-labelledby="report-title">
    <div class="report__head">
      <p class="eyebrow">完整報告</p>
      <p class="report__title" id="report-title"></p>
      <p class="report__meta" id="report-meta"></p>
    </div>
    <section class="rsec" aria-labelledby="h-summary">
      <div class="rsec__head"><span class="rsec__num">01</span><h2 id="h-summary">摘要</h2></div>
      <div id="sec-summary"></div>
    </section>
    <section class="rsec" aria-labelledby="h-findings">
      <div class="rsec__head"><span class="rsec__num">02</span><h2 id="h-findings">重點發現</h2></div>
      <div id="sec-findings"></div>
    </section>
    <section class="rsec" aria-labelledby="h-windows">
      <div class="rsec__head"><span class="rsec__num">03</span><h2 id="h-windows">完工時間窗</h2></div>
      <div id="sec-windows"></div>
    </section>
    <section class="rsec" aria-labelledby="h-states">
      <div class="rsec__head"><span class="rsec__num">04</span><h2 id="h-states">各州盤點</h2></div>
      <div id="sec-states"></div>
    </section>
    <section class="rsec" aria-labelledby="h-conflicts">
      <div class="rsec__head"><span class="rsec__num">05</span><h2 id="h-conflicts">差異與待確認</h2></div>
      <div id="sec-conflicts"></div>
    </section>
    <section class="rsec" aria-labelledby="h-coverage">
      <div class="rsec__head"><span class="rsec__num">06</span><h2 id="h-coverage">搜尋範圍與缺口</h2></div>
      <div id="sec-coverage"></div>
    </section>
    <section class="rsec" aria-labelledby="h-method">
      <div class="rsec__head"><span class="rsec__num">07</span><h2 id="h-method">方法與判斷準則</h2></div>
      <div id="sec-method"></div>
    </section>
    <section class="rsec" aria-labelledby="h-excluded">
      <div class="rsec__head"><span class="rsec__num">08</span><h2 id="h-excluded">排除清單</h2></div>
      <div id="sec-excluded"></div>
    </section>
  </article>
</main>

<footer class="foot" id="foot"></footer>

運中是誤植，8 MW 其實是擴建規模，iseek 全集團 2024-11 裝機僅 6 MW、契約 3 MW。(b) NEXTDC A1 地址以 NEXTDC 官網與 OSM 為準：125 Frome Street（2022 新聞稿寫 211 Pirie Street，是同一街區後門）；A1 為 5 MW IT 而非 10 MW，FY26 僅 Additional 2MW in progress。(c) 主管備忘稱 DCI 為印尼持有，但 DCI 官網寫 Brookfield portfolio company，疑似與 PT DCI Indonesia 混淆，請釐清。(d) Baxtel 把 IREN: Bundey 標為 Operational 並不正確。(e) RenewMap 的 South East Adelaide Co-Development 數字由 200 MW（較早）變為 1,200 MW（2026-10 頁面），RenewMap 南澳 active 專案數也由 16 個（1,105 MW，較早摘要）變為 19 個（2,311 MW）。\n4. 邊緣案例：IREN Bundey（電網 800 MW、IT 約 550 MW，EPBC 文件已送，2028 起通電）。IREN 是自營 AI cloud，官方未提出租空間，故放 excluded；若主管要保守保留，可改列 planned_filed 並將 leasable 設為 uncertain。Firmus Project Southgate（Tailem Bend + Stirling North）同理，且無任何申請紀錄。\n5. 南澳政策環境：2026-02 發布 s131 Crown Sponsorship 要求（大型資料中心視為 essential infrastructure，走 Crown Development，不必完全符合 Code）；2026-06-23/24 發布 Data Centre Strategy，擬立 Data Centre and AI Infrastructure Act（強制能源、水與國家利益標準以換取快審；Coordinator-General 權限；Greens 要求暫停）。州府原則包括：自付電力與電網連接成本且不得推高電價、不得危害電網穩定，以及必須向州政府揭露現有與潛在客戶（理由含 FIRB），這對台灣租戶的盡調與審查有影響；該原則針對 s131 新建大型案，是否適用 ADL1 這類棕地擴建尚未確認。\n6. 給 NSW 代理的附帶線索：DCI Sydney 01 位於 90 Peter Brock Drive, Eastern Creek（DatacenterMap 搜尋摘要，未開啟頁面），SYD02/SYD03 在其旁，街號仍未確認；DCI 官網一篇標為 2026-07 的 SYD02 稿件內容是舊稿（36 MW、A$400m、原定 2022 Q4），與 Linesight 的 64 MW 不同，需 NSW 代理核對。\n7. 本檔 ADL1 的座標與 LGA 來自 OSM 與 ABS 公開服務，不是規劃文件。","SA-B：結論：南澳區域與超大型提案角度沒有找到任何已核准、施工中且可租的 5 MW 以上案件。唯一正式送件的超大型案是 IREN Bundey（800 MW 併網負載；EPBC 轉介 2026-07-30；Crown sponsorship 已取得、Crown DA 未提出；最快 2028 通電），但 IREN 是垂直整合的 AI 雲業者，是否出租機房電力不明（leasable=uncertain）。SA-A 把它放在 excluded（captive），我保留為 planned_filed，請主管裁決。","SA-B：Firmus（約 2.3 GW IT）、Skylab（800 MW）、1414 Degrees/Aurora（最高 1 GW）都沒有任何規劃申請，依指示只列 gaps，並以 reason=other 放進 excluded 供稽核。","SA-B：Adelaide 都會區可租量極小（Baxtel 估全市約 20 MW）。值得追的兩案是 DigiCo ADL1 +15 MW（目標 FY28 底，洽談中）與 DCI ADL03（約 8 MW，2021 年 DA，無施工證據），SA-B-02 與 SA-B-03 分別與 SA-A-01 和 SA-A-02 重複，請合併。NEXTDC A1 只有 5 MW 且無空置證據；DCI ADL02 只有 4 MW。","SA-B：南澳審批流程：大型資料中心走 PDI Act s131 Crown sponsorship（DSD；表格 B 項要求揭露目標客群與 源稱 48 MW 在建；WA-B 查得 Belmont 的舊核准將於 2026-10-17 失效且無動工，Hazelmere 120 MW 已於 2026-05 撤回。並非在建案，不列入。","record_ids":[]},{"topic":"Mickleham（45 Donnybrook Road）營運商","detail":"報導指向 AirTrunk（批發出租），DatacenterMap 則列為 Amazon AWS（自建）；DFP 許可申請 PA2604506（2026-07-01）未具名申請人。放入觀察名單。","record_ids":[]},{"topic":"CDC Maddington 時程","detail":"較舊來源稱 2026 年營運；CDC 官網：主體工程 2025-12 開工、第一棟 2027-01 營運（約 34 MW）。採官網。","record_ids":[]},{"topic":"PA2403320（63 Sunshine Road, West Footscray）","detail":"底稿誤認為 NEXTDC M3；VIC-B 讀官員報告確認為 Perri 的 PMDC，NEXTDC M3 在 1 Paramount Road 一帶。","record_ids":[]},{"topic":"Fujitsu→Next Capital 的空置容量","detail":"報導稱五站合計 25 MW、約 7 MW 已租給約 130 個客戶；這是組合數字，各站空置量未公布。Greystanes 的『最高 60 MW』是場址潛力，不是現有容量。","record_ids":[]},{"topic":"Keppel Hazelwood North（720 MW）","detail":"VIC-A、VIC-B 列為送件中；VIC-C 讀 Latrobe City 2026-09 頁面，明寫尚未提出申請，已排除。","record_ids":[]},{"topic":"DCI 的持股","detail":"本人底稿寫『印尼持有』；SA-A、NT-B、ACT-A 三個代理一致回報 DCI 官網稱屬 Brookfield 旗下，採後者。","record_ids":[]},{"topic":"Macquarie Technology 新購地價格","detail":"早期報導約 A$1.68 億；ASX 公告（2026-08-06 交割）為 A$2.4 億（含其他成本 A$2.54 億），採 ASX。該地只有土地、尚無規劃申請，已排除。","record_ids":[]}],"narrative":{"headline":"可租、5 MW 以上、而且真的在蓋的專案只有 15 筆；落在 2026 Q4 – 2027 Q2 交付的只有 5 筆，且多半已預售或尚待營運商確認。","summary_paragraphs":["本次盤點由 18 個搜索代理分州地毯式搜索（NSW、VIC 各 3 個角度，其餘各州各 2 個），再由我對關鍵項目回頭讀政府文件與營運商原文做獨立驗證。結果共 79 筆：主清單 60 筆（可租或大概可租）、觀察名單 19 筆（出租性待確認）；另有 190 筆經查證後排除，其中雲端巨頭自建 21 筆、不足 5 MW 的 45 筆、已撤案 9 筆。每一筆都附地址與地圖座標：72 筆有完整門牌，其餘 7 筆只到街道、郊區或區域（例如 Minchinbury、Mawson Lakes、Project Ares），地圖上以虛線外框標示為近似。","主清單 60 筆裡，施工中 15 筆、已核准尚未動工 16 筆、已正式送件審查中 26 筆、已營運或近期完工 3 筆。落在你要的 2026 Q4 – 2027 Q2 時間窗的有 5 筆：GreenSquareDC SYD1 第一期（雪梨 Norwest，約 15 MW）、STACK MEL01C/D（墨爾本 Truganina，各 54 MW）、STACK MEL02（252 MW）、Vantage MEL1（Tullamarine，64 MW）、CDC Maddington 第一棟（Perth，約 34 MW，2027 年 1 月）。另外 Macquarie IC3 Super West 首期 6 MW 和 Cloud Carrier 的 Southern Highlands DB1（28 MW 裸殼）已經可用。","真正的限制不在『有沒有在蓋』，而在『有沒有剩』。NEXTDC 自己的 FY26 簡報顯示，NSW／ACT 的已簽約容量是已建成容量的 306%、VIC 是 261%；CDC 的容量多為長約預簽，主要服務政府與關鍵基礎設施客戶。公開資料看不到任何一棟的未租區塊，必須直接向營運商詢問。","各州概況：NSW（主清單 33 筆）與 VIC（21 筆）佔絕大多數；QLD、WA、ACT 各 2 筆；SA、TAS、NT 沒有已確認可租的專案，只有觀察名單（DigiCo 阿德雷德、DCI ADL03、IREN Bundey、Firmus 塔斯馬尼亞三案、Energy North 的 Project Ares），它們不是出租機房空間，或尚無核准與客戶。"],"key_findings":[{"title":"2026 Q4 – 2027 Q2 內交付的只有五個","body":"GreenSquareDC SYD1 第一期（約 15 MW，Norwest，W.Media 稱 2026 Q4 初始營運）、STACK MEL01C/D（各 54 MW）、STACK MEL02（252 MW）、Vantage MEL1（64 MW）、CDC Maddington MA1（約 34 MW，2027-01）。其中 STACK 的完工日只有聚合站與 STACK 官網的計畫年份，Vantage 官網沒有日期，可信度中等；STACK MEL01C&D 在承建商 Hickory 的網站上已列為『已完成』，可能是土建完成、機電與啟用仍在進行，需向 STACK 確認。"},{"title":"最接近 5 MW 尺度的是三個中小型案","body":"GreenSquareDC SYD1 第一期（14.9–15 MW，既有建築改造，2026 Q4）、Macquarie IC3 Super West（首期 6 MW，2026-09 啟用，後續 19 MW 設備已融資）、Cloud Carrier Southern Highlands DB1（28 MW 裸殼，已營運，Moss Vale）。其餘動輒 50–500 MW 的批發園區，5 MW 租戶幾乎沒有議價空間。"},{"title":"在建的大案幾乎都是批發型，而且多半已預售","body":"NEXTDC FY26 簡報（2026-08-27）：已簽約容量 740.1 MW、已建成 287.9 MW。S4 有 250 MW 在建、M3 有 165 MW、M2 有 60 MW、M4 有 10 MW，但 NSW、VIC 的簽約量都遠超已建成容量。CDC 的 Marsden Park（504 MW）、Laverton、Maddington 同樣以長約預簽為主。AirTrunk SYD3 為三階段、每階段約 24 個月的超大規模建設。"},{"title":"有 21 筆案子其實是雲端巨頭自建，不能租","body":"已查證並剔除 21 筆自建案，例如 AWS 的 3 Davis Road（開工通知明寫 AWS）、Project Echidna、Glendenning Road（約 194 MW）、墨爾本 Craigieburn／Cobblebank／Truganina 三案；Amazon 的 43-61 Turner Road（53 MW）；Microsoft 的 Honeman Close（96 MW）與 Station Road。這些常被第三方資料庫列為『資料中心在建』，但沒有任何可租空間。"},{"title":"垂直整合的 AI 雲不出租機房空間","body":"Firmus 在塔斯馬尼亞的三個 AI 工廠（St Leonards 施工中 84 MW、Bell Bay 288 MW 已核准但有 5 件上訴、Wesley Vale 52 MW）與 IREN Bundey（南澳，約 550 MW IT）賣的是 GPU 算力，不是機房空間，所以放在觀察名單。這也是 TAS、SA 沒有主清單專案的原因。"},{"title":"2028 年以後才有的新供給","body":"Goodman SYD01（Artarmon，首期 12.2 MW 於 2028-Q2）、Starwood／Doma／Telstra InfraCo Minchinbury（62 MW，2028-Q1，可選裸殼、powered shell 或 build-to-suit）、DCI SYD02（63 MW，2028 初）、DigiCo SYD1 擴建（47.5 MW，FY28 底）。其中 Goodman 的首期（12.2 MW）與 Minchinbury（可選裸殼、powered shell 或 build-to-suit）的單期尺度，相對接近中小型租戶。"},{"title":"Fujitsu 澳洲五站是唯一有『未租容量』線索的營運中資產","body":"Next Capital 於 2026-07-20 簽約收購，報導稱總容量 25 MW、約 7 MW 已租給約 130 個客戶，可擴建到 100 MW。但這是整個組合的數字，各站空置量未公布；Noble Park 12 MW（1988 年建、2015 年升級）、Greystanes 潛力最高 60 MW，建物老舊，高密度與液冷能力未知。"},{"title":"審批與政策風險在上升","body":"NSW 於 2026-08-17 發布 Data Centre Guidelines（核准附 firmed 再生能源 PPA 條件）；Goodman 於 2026-09-28 撤回 90 MW 的 Project Mars；維州 2026-09-22 發布永續資料中心行動計畫（住宅 150 公尺緩衝、禁止住宅區），Hume、Brimbank、Maribyrnong 曾要求暫停；昆州 2026-10-02 宣布資料中心審批收歸州級；GreenSquareDC WAi1 的舊核准將於 2026-10-17 失效且從未動工。"}],"window_notes":["已可用／營運中：Macquarie IC3 Super West 首期 6 MW（2026-09）、Cloud Carrier Southern Highlands DB1（28 MW 裸殼）、Fujitsu Greystanes（營運中，空置量未公布）。","2026 Q4 – 2027 Q2（5 筆）：GreenSquareDC SYD1 第一期、STACK MEL01C/D、STACK MEL02、Vantage MEL1、CDC Maddington MA1。","2027 下半年（3 筆）：CDC Marsden Park（分期交付自 2027-09）、NEXTDC S4（第一期約 2027 年中）、AirTrunk MEL2（首期 2027 下半年，但目前沒有施工證據）。","2028 年以後（10 筆）：Goodman SYD01、Minchinbury、DCI SYD02、DigiCo SYD1 擴建、Stockland／EdgeConneX MPark、CDC Hazelmere、DoverDC 等。","完工日未公布（39 筆）：多為已核准但尚未動工，或仍在審查階段；只有營運商或顧問的非官方說法時，不採用，標為未公布。"],"method":["納入條件：可出租（託管、批發、裸殼、powered shell、build-to-suit）、容量 5 MW 以上（或首期 5 MW 以上）、狀態為施工中、已核准、近期完工仍有容量、營運中且有擴建、或已向規劃機關正式送件。","排除條件：雲端巨頭自建（Amazon、AWS、Microsoft、Google、Meta、Oracle 等）、不足 5 MW、已撤案或否決、只有構想而未正式送件。排除項目列在 Excel『排除清單』分頁，供稽核。","分級：主清單＝可租或大概可租；觀察名單＝出租性待確認（垂直整合 AI 雲、等待基石客戶、營運商未證實、信心低）。觀察名單不計入標題數字。","證據順序：政府（規劃入口、許可登記冊、DA 登記）＞營運商官網與 ASX 公告＞專業媒體＞聚合站（Baxtel、RenewMap、ITK，只當線索）。NSW 的『已動工』判斷來自規劃入口『核准後文件』中的開工通知、施工環管計畫核准信等。","工作方式：18 個 Sonnet 搜索代理分州搜索，我（Claude）對關鍵項目回頭讀政府文件與營運商原文獨立驗證，並以人工裁決修正了多處代理之間的矛盾（例如 3 Davis Road 的歸屬、NEXTDC D2／SC2 只有 1–1.5 MW 在建、Keppel Hazelwood 尚未送件）。","座標：50 筆取自來源，其餘由 OpenStreetMap Nominatim 補上；精度分為來源提供、門牌級、街道級、郊區級（近似），地圖上近似者以虛線外框標示。"],"caveats":["搜索期間 WebSearch 額度（200 次）中途用盡，之後改用新聞 RSS 與直接抓取官方頁面，覆蓋面較薄；Wyndham、Latrobe、Monash 等區政府入口需登入、昆州 Coordinator-General／SARA／EDQ、PlanSA、NT 與塔州部分政府網站被擋，這些地方可能有漏網之魚。","MW 口徑不一：IT 負載、關鍵負載、銘牌容量、MVA、耗電量混用，標題加總只能當數量級參考，不可當交付容量。","完工日多數來自營運商自述、顧問文件或聚合站，不是施工合約日期；僅聚合站提供的年份已標為未公布或註明。","公開資料看不到任何一棟的『未租區塊』與預租比例，也看不到 CDC 對非政府外國商業租戶是否開放；這些必須直接詢問營運商。","一般的託管或租賃合約通常不涉及外資審查，但長期土地租賃、自建或取得土地權益可能觸發；本報告不構成法律意見，請向澳洲律師確認。","底圖使用 Esri 灰階圖磚（免金鑰、需標示出處）；對外商業使用前請確認其條款。"]}}</script>
