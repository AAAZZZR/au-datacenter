    '2027H2': '2027 下半年',
    '2028+': '2028 年以後',
    unknown: '完工日未公布',
  };
  const LEASABLE_ZH = { yes: '可租', likely: '大概可租', uncertain: '待確認' };
  const CONFIDENCE_ZH = { high: '高', medium: '中', low: '低' };
  const GEO_PRECISION_ZH = { source: '來源提供', address: '門牌級', street: '街道級', suburb: '郊區級（近似）' };
  const CAPACITY_BASIS_ZH = { IT: 'IT 負載', critical: '關鍵負載', nameplate: '銘牌容量', MVA: '變電容量（MVA）', power_consumption: '耗電量', unknown: '口徑不明' };
  const EXCLUDED_REASON_ORDER = ['captive', 'below_5mw', 'withdrawn', 'other'];
  const EXCLUDED_REASON_ZH = { captive: '雲端巨頭自建／不對外出租', below_5mw: '不足 5 MW', withdrawn: '已撤案或否決', other: '其他' };
  const TIER_ZH = { main: '主清單', watch: '觀察名單' };
  const WATCH_LONG_ZH = '觀察名單（出租性待確認）';
  const EMPTY_STATE_TEXT = '本次地毯式搜索未發現符合條件的專案';
  const WATCH_ONLY_TEXT = '本州僅有觀察名單，無已確認可租專案';
  const APPROX_PRECISIONS = ['street', 'suburb'];

  /* 記錄欄位：文字欄位一律轉成字串、清單欄位一律轉成字串陣列（資料可能缺漏或為 null） */
  const RECORD_TEXT_KEYS = [
    'id', 'state', 'project_name', 'operator', 'developer_owner', 'address', 'suburb', 'postcode', 'lga',
    'address_precision', 'address_notes', 'capacity_basis', 'capacity_notes', 'status', 'status_date',
    'construction_evidence', 'construction_start', 'expected_completion', 'completion_source', 'window',
    'window_basis', 'leasable', 'leasable_note', 'known_tenants', 'approval_ref', 'confidence', 'conflicts',
    'tier', 'tier_reason',
  ];
  const RECORD_LIST_KEYS = ['src_ids', 'gov_urls', 'operator_urls', 'press_urls', 'opened_sources', 'agents'];

  /* 底圖：Esri World Light／Dark Gray Canvas（底圖＋地名標註兩層，免金鑰，file:// 也可用）。
     原規格指定 CARTO，但 2026-10 實測 CARTO 對未帶 API key 的請求一律回傳「API KEY REQUIRED」浮水印圖磚。 */
  const ESRI_CANVAS = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas';
  const BASEMAP = {
    light: { base: `${ESRI_CANVAS}/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}`, labels: `${ESRI_CANVAS}/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}` },
    dark: { base: `${ESRI_CANVAS}/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}`, labels: `${ESRI_CANVAS}/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}` },
  };
  const TILE_MAX_NATIVE_ZOOM = 16;   // Esri Canvas 在 17 級以上沒有資料，改放大 16 級圖磚
  const TILE_ATTRIBUTION = 'Tiles &copy; <a href="https://www.esri.com/" target="_blank" rel="noopener noreferrer">Esri</a> &mdash; Esri, HERE, Garmin, &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors, and the GIS user community';
  const AUSTRALIA_BOUNDS = [[-43.8, 112.9], [-10.4, 153.8]];
  const CLUSTER_OFF_ZOOM = 14;   // 這個縮放層級以上不再群聚
  const LOCATE_ZOOM = 14;        // 「地圖定位」放大到的層級
  const FIT_MAX_ZOOM = 12;       // 自動縮放時最多放大到的層級
  const R_MIN = 6;               // 圓點半徑下限（px）
  const R_MAX = 24;              // 圓點半徑上限（px）
  const R_NULL = 5;              // 容量未公布的圓點半徑（比最小的圓點再小一點）

  /* 圖示（線條用 currentColor，顏色跟著文字 token 走） */
  const ICON_LOCATE = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5v3M8 11.5v3M1.5 8h3M11.5 8h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
  const ICON_COPY = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 3.5v-1a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h1" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>';

  /* =========================================================
     2. 小工具
     ========================================================= */
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const NF_MW = new Intl.NumberFormat('en-US', { maximumFractionDigits: 1 });

  function str(v) { return v === null || v === undefined ? '' : String(v).trim(); }
  function strList(v) { return Array.isArray(v) ? v.map(str).filter((s) => s !== '') : []; }
  function asArray(v) { return Array.isArray(v) ? v : []; }
  function num(v) { return typeof v === 'number' && Number.isFinite(v) ? v : null; }
  function esc(v) { return str(v).replace(/[&<>"']/g, (ch) => ESC[ch]); }
  function domId(v) { return str(v).replace(/[^A-Za-z0-9_-]/g, '_'); }
  function fmtMW(v) { return NF_MW.format(v); }
  function na(text) { return `<span class="na">${esc(text || '—')}</span>`; }
  function byId(id) { return document.getElementById(id); }

  /* 只接受 http(s) 連結；其他字串（例如 N/A）以純文字顯示 */
  function safeUrl(value) {
    const s = str(value);
    if (!/^https?:\/\//i.test(s)) return null;
    try {
      return new URL(s).href;
    } catch (err) {
      return null;
    }
  }
  function hostOf(href) { return new URL(href).hostname.replace(/^www\./, ''); }

  function debounce(fn, ms) {
    let timer = 0;
    return function debounced() {
      clearTimeout(timer);
      timer = setTimeout(fn, ms);
    };
  }

  /* 不在詞彙表內的狀態（資料錯誤）照原值顯示並標明，不另外翻譯 */
  function statusZh(v) {
    if (STATUS_ZH[v]) return STATUS_ZH[v];
    return v ? `其他狀態：${v}` : '狀態未知';
  }
  function leasableZh(v) { return LEASABLE_ZH[v] || v || '—'; }
  function confidenceZh(v) { return CONFIDENCE_ZH[v] || v || '—'; }
  function basisZh(v) { return CAPACITY_BASIS_ZH[v] || v || CAPACITY_BASIS_ZH.unknown; }
  function precisionZh(v) { return GEO_PRECISION_ZH[v] || v || '—'; }
  function sumMW(list) { return list.reduce((total, r) => total + (r.capacity_mw === null ? 0 : r.capacity_mw), 0); }

  /* 讀取 CSS token（依目前主題；主題切換時清空快取） */
  const tokenCache = new Map();
  function token(name) {
    if (!tokenCache.has(name)) {
      tokenCache.set(name, getComputedStyle(document.documentElement).getPropertyValue(name).trim());
    }
    return tokenCache.get(name);
  }

  /* =========================================================
     3. 讀取並整理資料
     ========================================================= */
  const els = {
    main: byId('main'),
    topMeta: byId('topbar-meta'),
    figures: byId('figures'),
    themeToggle: byId('theme-toggle'),
    desk: byId('desk'),
    controls: byId('controls'),
    stateTabs: byId('state-tabs'),
    statusChips: byId('status-chips'),
    windowChips: byId('window-chips'),
    watchChip: byId('watch-chip'),
    search: byId('search'),
    count: byId('result-count'),
    reset: byId('reset-filters'),
    mapCol: byId('map-col'),
    map: byId('map'),
    mapNotice: byId('map-notice'),
    listCol: byId('list-col'),
    list: byId('list'),
    reportTitle: byId('report-title'),
    reportMeta: byId('report-meta'),
    secSummary: byId('sec-summary'),
    secFindings: byId('sec-findings'),
    secWindows: byId('sec-windows'),
    secStates: byId('sec-states'),
    secConflicts: byId('sec-conflicts'),
    secCoverage: byId('sec-coverage'),
    secMethod: byId('sec-method'),
    secExcluded: byId('sec-excluded'),
    foot: byId('foot'),
    srStatus: byId('sr-status'),
  };

  const DATA = readData();
  const META = DATA.meta || {};
  const NARRATIVE = DATA.narrative || {};
  const STATES = asArray(DATA.states).map(normalizeState).filter((s) => s.code !== '');
  const STATE_BY_CODE = new Map(STATES.map((s) => [s.code, s]));
  const STATE_INDEX = new Map(STATES.map((s, i) => [s.code, i]));
  const RECS = normalizeRecords(asArray(DATA.records));
  const REC_BY_ID = new Map(RECS.map((r) => [r.id, r]));
  const RECS_BY_STATE = new Map(STATES.map((s) => [s.code, RECS.filter((r) => r.state === s.code)]));
  const ORPHAN_RECS = RECS.filter((r) => !STATE_BY_CODE.has(r.state));   // 州別代碼不在清單內（理論上不會發生）
  const MAIN_RECS = RECS.filter((r) => !r.isWatch);
  const WATCH_RECS = RECS.filter((r) => r.isWatch);
  const EXCLUDED = asArray(DATA.excluded).map(normalizeExcluded).sort((a, b) => stateRank(a.state) - stateRank(b.state));
  const CONFLICTS = asArray(DATA.conflicts).map(normalizeConflict);

  function readData() {
    const node = byId('dc-data');
    try {
      return JSON.parse(node.textContent);
    } catch (err) {
      els.main.insertAdjacentHTML('afterbegin', `<p class="fatal" role="alert">資料區塊無法解析，頁面無法顯示：${esc(err.message)}</p>`);
      throw err;
    }
  }

  function normalizeState(raw) {
    const s = raw || {};
    const code = str(s.code);
    const center = asArray(s.center);
    const lat = num(center[0]);
    const lon = num(center[1]);
    return {
      code,
      name_zh: str(s.name_zh) || STATE_ZH[code] || code,
      name_en: str(s.name_en),
      center: lat !== null && lon !== null ? [lat, lon] : null,
      zoom: num(s.zoom) !== null ? Math.round(s.zoom) : 7,
      agents: strList(s.agents),
      search_log: strList(s.search_log),
      gaps: strList(s.gaps),
      agent_notes: strList(s.agent_notes),
    };
  }

  function normalizeRecord(raw, index) {
    const r = {};
    RECORD_TEXT_KEYS.forEach((key) => { r[key] = str(raw[key]); });
    RECORD_LIST_KEYS.forEach((key) => { r[key] = strList(raw[key]); });
    r.capacity_mw = num(raw.capacity_mw);
    r.first_phase_mw = num(raw.first_phase_mw);
    const geo = raw.geo || {};
    r.geo = { lat: num(geo.lat), lon: num(geo.lon), precision: str(geo.precision), note: str(geo.note) };
    if (r.id === '') r.id = `REC-${String(index + 1).padStart(3, '0')}`;
    // 分級缺漏時依規格推回：可租性「待確認」= 觀察名單
    if (r.tier !== 'main' && r.tier !== 'watch') r.tier = r.leasable === 'uncertain' ? 'watch' : 'main';
    r.isWatch = r.tier === 'watch';
    r.hasGeo = r.geo.lat !== null && r.geo.lon !== null;
    r.isApprox = APPROX_PRECISIONS.includes(r.geo.precision);
    r.windowKey = WINDOW_ORDER.includes(r.window) ? r.window : 'unknown';
    r.searchText = [r.project_name, r.operator, r.address, r.suburb].join(' ').toLowerCase();
    return r;
  }

  /* 編號去重、依州別排序；同一州內主清單在前、觀察名單在後（其餘維持資料原順序） */
  function normalizeRecords(rawList) {
    const seen = new Set();
    const list = rawList.map((raw, i) => {
      const r = normalizeRecord(raw || {}, i);
      let id = r.id;
      let n = 2;
      while (seen.has(id)) {
        id = `${r.id}-${n}`;
        n += 1;
      }
      if (id !== r.id) console.warn(`記錄編號重複：${r.id}，此筆改以 ${id} 顯示`);
      r.id = id;
      seen.add(id);
      return r;
    });
    return list.sort((a, b) => (stateRank(a.state) - stateRank(b.state)) || (Number(a.isWatch) - Number(b.isWatch)));
  }

  function stateRank(code) { return STATE_INDEX.has(code) ? STATE_INDEX.get(code) : STATES.length; }
  function stateName(code) { return STATE_BY_CODE.has(code) ? STATE_BY_CODE.get(code).name_zh : (STATE_ZH[code] || code || '州別未知'); }

  function normalizeExcluded(raw, index) {
    const e = raw || {};
    return {
      id: str(e.id) || `EX-${String(index + 1).padStart(3, '0')}`,
      state: str(e.state),
      project_name: str(e.project_name),
      operator: str(e.operator),
      address: str(e.address),
      capacity_mw: num(e.capacity_mw),
      reason: str(e.reason) || 'other',
      reason_zh: str(e.reason_zh),
      note: str(e.note),
      urls: strList(e.urls),
    };
  }

  function normalizeConflict(raw) {
    const c = raw || {};
    return { topic: str(c.topic), detail: str(c.detail), record_ids: strList(c.record_ids) };
  }

  /* 某州的主清單／觀察名單筆數 */
  function tierCounts(list) {
    const watch = list.filter((r) => r.isWatch).length;
    return { main: list.length - watch, watch, total: list.length };
  }

  /* =========================================================
     4. 篩選狀態
     ========================================================= */
  const filters = { state: 'ALL', statuses: new Set(), windows: new Set(), includeWatch: true, query: '' };
  let queryTokens = [];
  let visibleIds = new Set();
  let selectedId = null;
  let mapView = null;

  function matches(r) {
    if (filters.state !== 'ALL' && r.state !== filters.state) return false;
    if (filters.statuses.size > 0 && !filters.statuses.has(r.status)) return false;
    if (filters.windows.size > 0 && !filters.windows.has(r.windowKey)) return false;
    if (!filters.includeWatch && r.isWatch) return false;
    return queryTokens.every((t) => r.searchText.includes(t));
  }

  function filtersAreDefault() {
    return filters.state === 'ALL' && filters.statuses.size === 0 && filters.windows.size === 0
      && filters.includeWatch && queryTokens.length === 0;
  }

  function setQuery(value) {
    filters.query = value;
    queryTokens = value.toLowerCase().split(/\s+/).filter((t) => t !== '');
  }

  function resetFilters(stateCode) {
    filters.state = stateCode || 'ALL';
    filters.statuses.clear();
    filters.windows.clear();
    filters.includeWatch = true;
    els.search.value = '';
    setQuery('');
  }

  /* =========================================================
     5. 共用的小片段 HTML
     ========================================================= */
  function statusPill(status) {
    return `<span class="pill" data-status="${esc(status)}">${esc(statusZh(status))}</span>`;
  }

  function tierBadge() {
    return `<span class="tier-badge" title="${esc(WATCH_LONG_ZH)}"><span class="ring-icon" aria-hidden="true"></span>${TIER_ZH.watch}</span>`;
  }

  function confidenceHtml(level, withLabel) {
    return `<span class="conf" data-conf="${esc(level)}"><span class="conf__dot" aria-hidden="true"></span>${withLabel ? '可信度 ' : ''}${esc(confidenceZh(level))}</span>`;
  }

  function capacityCard(r) {
    if (r.capacity_mw === null) return na('容量未公布');
    return `<span class="mw">${fmtMW(r.capacity_mw)}</span><span class="mw-unit">MW</span><span class="basis">${esc(basisZh(r.capacity_basis))}</span>`;
  }

  function capacityInline(r) {
    if (r.capacity_mw === null) return '容量未公布';
    return `<span class="mono">${fmtMW(r.capacity_mw)} MW</span>（${esc(basisZh(r.capacity_basis))}）`;
  }

  function linkHtml(url, text) {
    const href = safeUrl(url);
    if (!href) return `<span class="na" title="不是有效的網址">${esc(text)}</span>`;
    return `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="${esc(href)}">${esc(text)}</a>`;
  }

  /* 卡片與彈出視窗：政府／營運商／媒體各取第一個連結 */
  function firstLinks(r) {
    const groups = [['政府', r.gov_urls], ['營運商', r.operator_urls], ['媒體', r.press_urls]];
    const out = [];
    groups.forEach(([label, urls]) => {
      const valid = urls.map(safeUrl).filter(Boolean);
      if (valid.length === 0) return;
      const more = valid.length > 1 ? `<span class="more">+${valid.length - 1}</span>` : '';
      out.push(`<span class="lnk">${linkHtml(valid[0], label)}${more}</span>`);
    });
    return out;
  }

  function locateButton(r, label, withIcon) {
    const disabled = r.hasGeo ? '' : ' disabled title="此專案沒有座標"';
    const cls = withIcon ? 'btn' : 'btn btn--plain';
    return `<button type="button" class="${cls}" data-action="locate" data-id="${esc(r.id)}"${disabled}>${withIcon ? ICON_LOCATE : ''}<span>${esc(label)}</span></button>`;
  }

  function bulletBlock(title, items, tag, cls) {
    const head = `<${tag}${cls ? ` class="${cls}"` : ''}>${esc(title)}</${tag}>`;
    if (items.length === 0) return `${head}<p class="na">（無紀錄）</p>`;
    return `${head}<ul>${items.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>`;
  }

  /* 「本次地毯式搜索未發現符合條件的專案」面板：清單欄與報告共用 */
  function emptyStateHtml(s, where) {
    const inList = where === 'list';
    const subTag = inList ? 'p' : 'h4';
    return `<div class="empty"${inList ? ` data-empty-state="${esc(s.code)}" hidden` : ''}>
      ${inList ? `<p class="empty__kicker">${esc(s.name_zh)} <span class="mono">${esc(s.code)}</span></p>` : ''}
      <p class="empty__title">${EMPTY_STATE_TEXT}</p>
      ${bulletBlock('搜尋紀錄', s.search_log, subTag, 'empty__sub')}
      ${bulletBlock('缺口', s.gaps, subTag, 'empty__sub')}
    </div>`;
  }

  /* =========================================================
     6. 頂欄與篩選控制列
     ========================================================= */
  function renderTopbar() {
    const metaParts = [];
    if (str(META.title_zh)) metaParts.push(esc(META.title_zh));
    metaParts.push(`資料日期 <span class="mono">${esc(META.generated) || '—'}</span>`);
    if (num(META.threshold_mw) !== null) metaParts.push(`門檻 ≥ ${fmtMW(META.threshold_mw)} MW`);
    els.topMeta.innerHTML = metaParts.join('<span class="sep" aria-hidden="true">·</span>');

    // 頂欄數字只算主清單；觀察名單另外註明
    const underConstruction = MAIN_RECS.filter((r) => r.status === 'under_construction').length;
    const statesWithMain = STATES.filter((s) => tierCounts(RECS_BY_STATE.get(s.code)).main > 0).length;
    const watchNote = WATCH_RECS.length > 0 ? `<span class="figure__note">另有 ${WATCH_RECS.length} 筆<wbr>觀察名單</span>` : '';
    els.figures.innerHTML = [
      figureHtml('專案數', `${MAIN_RECS.length}${watchNote}`, ''),
      figureHtml('施工中數', String(underConstruction), ''),
      figureHtml('已知總 MW', fmtMW(sumMW(MAIN_RECS)), '各專案容量口徑不一（IT、銘牌、MVA 等），加總僅供量級參考；不含觀察名單'),
      figureHtml(`涵蓋 ${STATES.length} 州`, `${statesWithMain}<small>州有結果</small>`, ''),
    ].join('');
  }

  function figureHtml(label, valueHtml, title) {
    return `<div class="figure"${title ? ` title="${esc(title)}"` : ''}><dt>${esc(label)}</dt><dd>${valueHtml}</dd></div>`;
  }

  function renderControls() {
    const tabs = [{ code: 'ALL', name: '全部', counts: tierCounts(RECS) }].concat(
      STATES.map((s) => ({ code: s.code, name: s.name_zh, counts: tierCounts(RECS_BY_STATE.get(s.code)) })),
    );
    els.stateTabs.innerHTML = tabs.map(stateTabHtml).join('');
    els.statusChips.innerHTML = STATUS_ORDER.map((key) => `<button type="button" class="chip" data-status="${key}" data-filter-status="${key}" aria-pressed="false"><span class="chip__dot" aria-hidden="true"></span>${esc(STATUS_ZH[key])}</button>`).join('');
    els.windowChips.innerHTML = WINDOW_ORDER.map((key) => `<button type="button" class="chip" data-filter-window="${esc(key)}" aria-pressed="false">${esc(WINDOW_ZH[key])}</button>`).join('');
  }

  /* 州別分頁：主清單筆數，觀察名單以較小的「+ N」附在後面 */
  function stateTabHtml(t) {
    const isAll = t.code === 'ALL';
    const label = `${t.name}：${t.counts.main} 筆${t.counts.watch > 0 ? `，另有 ${t.counts.watch} 筆觀察名單` : ''}`;
    const watch = t.counts.watch > 0 ? `<span class="state-tab__watch">+ ${t.counts.watch}</span>` : '';
    return `<button type="button" class="state-tab${t.counts.total === 0 ? ' is-empty' : ''}" data-state="${esc(t.code)}" aria-pressed="false" aria-label="${esc(label)}" title="${esc(label)}">`
      + `<span class="state-tab__name">${esc(t.name)}</span>`
      + (isAll ? '' : `<span class="state-tab__code">${esc(t.code)}</span>`)
      + `<span class="state-tab__count">${t.counts.main}</span>${watch}</button>`;
  }

  /* =========================================================
     7. 專案清單（卡片一次產生，篩選時只切換 hidden）
     ========================================================= */
  const cardEls = new Map();        // 專案編號 → 卡片元素
  const groupViews = [];            // 州別分組：{ el, countEl, ids }
  const emptyStateEls = new Map();  // 州代碼 → 「未發現」面板

  function renderList() {
    const parts = [
      '<div class="empty" id="no-match" hidden><p class="empty__title" id="no-match-text"></p>'
        + '<p class="empty__actions"><button type="button" class="btn" data-action="include-watch" id="no-match-watch" hidden>顯示觀察名單</button> '
        + '<button type="button" class="btn" data-action="reset">重設篩選</button></p></div>',
    ];
    STATES.forEach((s) => {
      const list = RECS_BY_STATE.get(s.code);
      parts.push(list.length === 0 ? emptyStateHtml(s, 'list') : groupHtml(s.code, s.name_zh, list));
    });
    if (ORPHAN_RECS.length > 0) parts.push(groupHtml('OTHER', '州別不明', ORPHAN_RECS));
    parts.push(zeroNoteHtml());
    els.list.innerHTML = parts.join('');

    els.list.querySelectorAll('.card').forEach((el) => cardEls.set(el.dataset.id, el));
    els.list.querySelectorAll('.group').forEach((el) => {
      groupViews.push({
        el,
        countEl: el.querySelector('.group__count'),
        ids: Array.from(el.querySelectorAll('.card'), (card) => card.dataset.id),
      });
    });
    els.list.querySelectorAll('[data-empty-state]').forEach((el) => emptyStateEls.set(el.dataset.emptyState, el));
  }

  function groupHtml(code, name, list) {
    const counts = tierCounts(list);
    const watchOnly = counts.main === 0 && counts.watch > 0;
    return `<section class="group" data-group="${esc(code)}" aria-labelledby="g-${domId(code)}">
      <div class="group__head"><h3 class="group__title" id="g-${domId(code)}">${esc(name)}${code === 'OTHER' ? '' : `<span class="group__code">${esc(code)}</span>`}</h3><span class="group__count"></span></div>
      ${watchOnly ? `<p class="note-watch"><strong>${WATCH_ONLY_TEXT}</strong></p>` : ''}
      ${list.map(cardHtml).join('')}
    </section>`;
  }

  function zeroNoteHtml() {
    const zero = STATES.filter((s) => RECS_BY_STATE.get(s.code).length === 0);
    if (zero.length === 0) return '';
    const buttons = zero.map((s) => `<button type="button" class="linkish" data-action="select-state" data-state="${esc(s.code)}">${esc(s.name_zh)}</button>`).join('、');
    return `<p class="zero-note" id="zero-note">本次未發現符合條件專案的州：${buttons}（點選可看搜尋紀錄與缺口）</p>`;
  }

  function cardHtml(r) {
    const links = firstLinks(r);
    const name = esc(r.project_name) || '（未命名專案）';
    // 可收合的長文字欄位，「展開」按鈕用 aria-controls 指向它們
    const key = domId(r.id);
    const clampIds = [`ce-${key}`];
    if (r.leasable_note) clampIds.push(`ln-${key}`);
    if (r.conflicts) clampIds.push(`cf-${key}`);
    return `<article class="card${r.isWatch ? ' is-watch' : ''}" id="card-${domId(r.id)}" data-id="${esc(r.id)}" aria-labelledby="ct-${domId(r.id)}">
      <div class="card__top">
        <span class="card__id mono">${esc(r.id)}</span>
        <span class="card__badges">${r.isWatch ? tierBadge() : ''}${statusPill(r.status)}</span>
      </div>
      <h4 class="card__title" id="ct-${domId(r.id)}">${name}</h4>
      <p class="card__operator">${esc(r.operator) || '營運商未公布'}</p>
      <dl class="facts">
        <dt>容量</dt><dd>${capacityCard(r)}</dd>
        <dt>地址</dt><dd><span class="selectable">${esc(r.address) || na('地址未公布')}</span>${r.isApprox ? '<span class="tag">座標近似</span>' : ''}${r.hasGeo ? '' : '<span class="tag">無座標</span>'}</dd>
        <dt>完工</dt><dd>${esc(WINDOW_ZH[r.windowKey])}${r.expected_completion ? `<span class="sep">·</span>${esc(r.expected_completion)}` : ''}</dd>
        <dt>施工證據</dt><dd class="clamp" id="ce-${key}">${esc(r.construction_evidence) || na()}</dd>
        ${r.leasable_note ? `<dt>可租說明</dt><dd class="clamp" id="ln-${key}">${esc(r.leasable_note)}</dd>` : ''}
      </dl>
      <p class="card__meta">${confidenceHtml(r.confidence, true)}<span>可租判斷：${esc(leasableZh(r.leasable))}</span></p>
      ${r.isWatch && r.tier_reason ? `<p class="card__tier">觀察原因：${esc(r.tier_reason)}</p>` : ''}
      ${r.conflicts ? `<p class="card__conflict"><span class="warn-mark" aria-hidden="true"></span><b>差異</b><span class="clamp" id="cf-${key}">${esc(r.conflicts)}</span></p>` : ''}
      <button type="button" class="card__more" data-action="toggle-card" aria-expanded="false" aria-controls="${clampIds.join(' ')}" hidden>展開</button>
      <div class="card__foot">
        <span class="links">${links.length > 0 ? links.join('') : na('無來源連結')}</span>
        <span class="card__actions">
          ${locateButton(r, '地圖定位', true)}
          <button type="button" class="btn" data-action="copy" data-id="${esc(r.id)}"${r.address ? '' : ' disabled'}>${ICON_COPY}<span>複製地址</span></button>
        </span>
      </div>
    </article>`;
  }

  /* =========================================================
     8. 地圖
     ========================================================= */

  /* 圓點半徑：依 MW 的平方根縮放，並設上下限 */
  function radiusFor(mw) {
    return Math.max(R_MIN, Math.min(R_MAX, 4 + Math.sqrt(Math.max(0, mw))));
  }

  /* 圓點樣式：
     主清單＝實心（容量未公布＝淡色小圓點）；觀察名單＝狀態色圓環（約 12% 填色、粗外框）；
     座標為街道級或郊區級＝虛線外框；hot＝清單滑過或彈出視窗開啟中 */
  function markerStyle(r, hot) {
    const color = token(`--st-${r.status}`) || token('--ink-3');
    const hasMw = r.capacity_mw !== null;
    const style = {
      radius: hasMw ? radiusFor(r.capacity_mw) : R_NULL,
      color: token('--surface'),
      weight: 1.5,
      opacity: 1,
      fillColor: color,
      fillOpacity: 0.85,
      dashArray: null,
    };
    if (r.isWatch) {
      style.color = color;
      style.weight = 3;
      style.fillOpacity = 0.12;
    } else if (!hasMw) {
      style.color = color;
      style.fillOpacity = 0.4;
    }
    if (r.isApprox) {
      style.dashArray = r.isWatch ? '5 4' : '3 3';
      if (!r.isWatch && hasMw) {
        style.color = token('--ink');
        style.fillOpacity = 0.6;
      }
    }
    if (hot) {
      style.color = token('--ink');
      style.weight = Math.max(style.weight, 3) + 0.5;
    }
    return style;
  }

  function legendHtml() {
    const statusItems = STATUS_ORDER.map((key) => `<li><span class="ldot" data-status="${key}"></span>${esc(STATUS_ZH[key])}</li>`).join('');
    // 三個容量樣本並排、底部對齊
    const samples = [10, 100, 400];
    const maxR = radiusFor(samples[samples.length - 1]);
    const height = Math.ceil(maxR * 2) + 16;
    let x = 2;
    const shapes = samples.map((mw) => {
      const r = radiusFor(mw);
      const cx = x + r;
      const cy = maxR * 2 + 1 - r;
      x += r * 2 + 12;
      return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}"></circle>`
        + `<text x="${cx.toFixed(1)}" y="${height - 2}" text-anchor="middle">${mw}</text>`;
    }).join('');
    const width = Math.ceil(x);
    return `<details class="legend"><summary>圖例</summary><div class="legend__body">
      <p class="legend__sub">狀態（填色）</p>
      <ul class="legend__list">${statusItems}</ul>
      <p class="legend__sub">圓點大小 = 容量（MW）</p>
      <svg class="legend__sizes" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" aria-hidden="true">${shapes}</svg>
      <ul class="legend__list">
        <li><span class="ldot ldot--watch"></span>圓環 = ${esc(WATCH_LONG_ZH)}</li>
        <li><span class="ldot ldot--null"></span>淡色小圓點 = 容量未公布</li>
        <li><span class="ldot ldot--approx"></span>虛線外框 = 座標為近似</li>
      </ul>
    </div></details>`;
  }

  function popupHtml(r) {
    const links = firstLinks(r);
    const gmaps = `https://www.google.com/maps/search/?api=1&query=${r.geo.lat},${r.geo.lon}`;
    links.push(`<span class="lnk"><a href="${esc(gmaps)}" target="_blank" rel="noopener noreferrer">Google 地圖</a></span>`);
    const completion = `${esc(WINDOW_ZH[r.windowKey])}${r.expected_completion ? ` · ${esc(r.expected_completion)}` : ''}`
      + (r.completion_source ? `<span class="sub">來源：${esc(r.completion_source)}</span>` : '');
    const leasable = `${esc(leasableZh(r.leasable))}${r.leasable_note ? `<span class="sub">${esc(r.leasable_note)}</span>` : ''}`;
    return `<div class="pop">
      <p class="pop__kicker"><span class="mono">${esc(r.id)}</span> · ${esc(stateName(r.state))}</p>
      <h3 class="pop__title">${esc(r.project_name) || '（未命名專案）'}</h3>
      <p class="pop__operator">${esc(r.operator) || '營運商未公布'}</p>
      <div class="pop__badges">${statusPill(r.status)}${r.isWatch ? tierBadge() : ''}</div>
      ${r.isWatch && r.tier_reason ? `<p class="pop__tier">觀察原因：${esc(r.tier_reason)}</p>` : ''}
      ${r.isApprox ? `<p class="pop__note"><span class="dash-ring" aria-hidden="true"></span>座標為近似 · 精度：${esc(precisionZh(r.geo.precision))}</p>` : ''}
      <dl class="kv">
        <dt>地址</dt><dd>${esc(r.address) || na('地址未公布')}</dd>
        <dt>容量</dt><dd>${capacityInline(r)}</dd>
        <dt>完工</dt><dd>${completion}</dd>
        <dt>施工證據</dt><dd>${esc(r.construction_evidence) || na()}</dd>
        <dt>可租判斷</dt><dd>${leasable}</dd>
        <dt>可信度</dt><dd>${confidenceHtml(r.confidence, false)}</dd>
      </dl>
      <p class="pop__links">${links.join('')}</p>
    </div>`;
  }

  function showMapNotice(title, text, fatal) {
    els.mapNotice.innerHTML = `<strong>${esc(title)}</strong>${esc(text)}`;
    els.mapNotice.classList.toggle('map-notice--fatal', fatal);
    els.mapNotice.hidden = false;
  }

  function hideMapNotice() { els.mapNotice.hidden = true; }

  /* 建立地圖；Leaflet 沒載入（離線）時回傳 null，清單與報告照常運作 */
  function createMapView() {
    const L = window.L;
    if (!L || typeof L.map !== 'function') {
      showMapNotice('地圖無法載入', '地圖元件（Leaflet）未能載入，可能是目前離線。專案清單與下方報告仍可正常使用。', true);
      return null;
    }

    const map = L.map(els.map, {
      minZoom: 3,
      maxZoom: 18,   // 縮放維持整數層級：小數層級會讓圖磚之間出現細縫
      zoomAnimation: !REDUCED_MOTION,
      fadeAnimation: !REDUCED_MOTION,
      markerZoomAnimation: !REDUCED_MOTION,
    });
    map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener noreferrer">Leaflet</a>');

    const markers = new Map();   // 專案編號 → circleMarker
    let hotId = null;            // 清單上滑過的專案
    let openId = null;           // 彈出視窗開啟中的專案
    let hotClusterIcon = null;   // 被標亮的群聚圖示
    let shownKey = null;         // 目前地圖上的專案集合（避免重複重建）
    let queuedView = null;       // 縮放動畫進行中時，延後執行的視野變更

    // markercluster 加入地圖前必須先有視野
    fitTo(new Set(RECS.map((r) => r.id)), 'ALL', false);

    let tileLayers = addBasemap(effectiveTheme());

    const group = typeof L.markerClusterGroup === 'function'
      ? L.markerClusterGroup({
        disableClusteringAtZoom: CLUSTER_OFF_ZOOM,
        maxClusterRadius: 46,
        showCoverageOnHover: false,
        spiderfyOnMaxZoom: true,
        animate: false,   // circleMarker 不支援群聚動畫，關掉以免跳動
        iconCreateFunction: clusterIcon,
      })
      : L.featureGroup();   // 群聚外掛沒載入時：不群聚，其餘功能照常
    group.addTo(map);

    // Leaflet 在縮放動畫期間會忽略新的視野，等動畫結束再執行
    map.on('zoomend', () => {
      if (!queuedView) return;
      const run = queuedView;
      queuedView = null;
      run();
    });

    const popupMaxHeight = Math.max(220, Math.min(440, els.map.clientHeight - 90));
    RECS.forEach((r) => {
      if (!r.hasGeo) return;
      const style = markerStyle(r, false);
      const marker = L.circleMarker([r.geo.lat, r.geo.lon], style);
      marker.bindPopup(() => popupHtml(r), {
        maxWidth: 340,
        minWidth: 250,
        maxHeight: popupMaxHeight,
        autoPanPadding: [18, 18],
        className: 'dc-popup',
      });
      marker.bindTooltip(esc(r.project_name) || '（未命名專案）', {
        direction: 'top',
        offset: [0, -style.radius],
        opacity: 1,
        className: 'dc-tip',
      });
      marker.on('click', () => onMarkerClick(r.id));
      marker.on('popupopen', () => { openId = r.id; restyle(r.id); });
      marker.on('popupclose', () => {
        if (openId === r.id) openId = null;
        restyle(r.id);
      });
      markers.set(r.id, marker);
    });

    addLegend();
    observeSize();

    /* 只顯示指定的專案；fitState 有值時重新縮放到可見的圓點 */
    function show(ids, fitState) {
      const key = Array.from(ids).join('|');
      if (key !== shownKey) {
        shownKey = key;
        clearHotCluster();
        group.clearLayers();
        const layers = [];
        ids.forEach((id) => { if (markers.has(id)) layers.push(markers.get(id)); });
        if (typeof group.addLayers === 'function') group.addLayers(layers);
        else layers.forEach((layer) => group.addLayer(layer));
      }
      if (fitState) whenIdle(() => fitTo(ids, fitState, !REDUCED_MOTION));
    }

    /* 縮放到可見圓點；沒有圓點時改用該州的中心與縮放，「全部」則看整個澳洲 */
    function fitTo(ids, stateCode, animate) {
      const points = [];
      ids.forEach((id) => {
        const r = REC_BY_ID.get(id);
        if (r && r.hasGeo) points.push([r.geo.lat, r.geo.lon]);
      });
      if (points.length === 0) {
        const st = STATE_BY_CODE.get(stateCode);
        if (st && st.center) map.setView(st.center, st.zoom, { animate });
        else map.fitBounds(AUSTRALIA_BOUNDS, { animate });
        return;
      }
      const bounds = L.latLngBounds(points);
      if (bounds.getSouthWest().equals(bounds.getNorthEast())) {
        map.setView(bounds.getCenter(), FIT_MAX_ZOOM, { animate });
      } else {
        map.fitBounds(bounds, { padding: [44, 44], maxZoom: FIT_MAX_ZOOM, animate });
      }
    }

    function whenIdle(run) {
      if (map._animatingZoom) {
        queuedView = run;
        return;
      }
      queuedView = null;
      run();
    }

    /* 放大到該專案並開啟彈出視窗 */
    function focus(id) {
      const marker = markers.get(id);
      if (!marker) return;
      whenIdle(() => {
        const zoom = Math.max(Math.round(map.getZoom()), LOCATE_ZOOM);
        map.once('moveend', () => openPopupFor(marker));
        map.setView(marker.getLatLng(), zoom, { animate: !REDUCED_MOTION });
      });
    }

    function openPopupFor(marker) {
      if (map.hasLayer(marker)) {
        marker.openPopup();
        return;
      }
      // 仍在群聚裡（例如同一座標的多筆專案）：交給 markercluster 展開
      if (typeof group.zoomToShowLayer === 'function' && group.hasLayer(marker)) {
        group.zoomToShowLayer(marker, () => {
          if (map.hasLayer(marker)) marker.openPopup();
        });
      }
    }

    /* 清單滑過：標亮圓點；圓點在群聚裡時標亮群聚 */
    function setHot(id) {
      if (id === hotId) return;
      const previous = hotId;
      hotId = id;
      clearHotCluster();
      if (previous) restyle(previous);
      if (!id || !markers.has(id)) return;
      const marker = markers.get(id);
      if (map.hasLayer(marker)) {
        restyle(id);
        return;
      }
      if (typeof group.getVisibleParent === 'function' && group.hasLayer(marker)) {
        const parent = group.getVisibleParent(marker);
        const icon = parent && parent !== marker && typeof parent.getElement === 'function' ? parent.getElement() : null;
        if (icon) {
          icon.classList.add('is-hot');
          hotClusterIcon = icon;
        }
      }
    }

    function clearHotCluster() {
      if (!hotClusterIcon) return;
      hotClusterIcon.classList.remove('is-hot');
      hotClusterIcon = null;
    }

    function restyle(id) {
      const marker = markers.get(id);
      const r = REC_BY_ID.get(id);
      if (!marker || !r) return;
      const hot = id === hotId || id === openId;
      marker.setStyle(markerStyle(r, hot));
      if (hot && map.hasLayer(marker)) marker.bringToFront();
    }

    /* 底圖兩層：灰階底圖在下、地名標註在上 */
    function addBasemap(theme) {
      const urls = BASEMAP[theme];
      const shared = { maxNativeZoom: TILE_MAX_NATIVE_ZOOM, maxZoom: 18 };
      const base = L.tileLayer(urls.base, { ...shared, zIndex: 1, attribution: TILE_ATTRIBUTION }).addTo(map);
      const labels = L.tileLayer(urls.labels, { ...shared, zIndex: 2 }).addTo(map);
      watchTiles(base);
      return [base, labels];
    }

    /* 主題切換：換一組底圖、依新 token 重畫圓點。
       不用 setUrl：Leaflet 1.9 的 redraw 在小數縮放層級會把 {z} 帶成小數（例如 4.75），圖磚全部失效 */
    function applyTheme() {
      tileLayers.forEach((layer) => map.removeLayer(layer));
      tileLayers = addBasemap(effectiveTheme());
      markers.forEach((marker, id) => restyle(id));
    }

    function clusterIcon(cluster) {
      const n = cluster.getChildCount();
      const size = n < 10 ? 32 : (n < 50 ? 38 : 44);
      return L.divIcon({ html: `<span>${n}</span>`, className: 'dc-cluster', iconSize: L.point(size, size) });
    }

    function addLegend() {
      const Legend = L.Control.extend({
        options: { position: 'topright' },   // 全澳視野時右上角是海面，最不會蓋到圓點
        onAdd() {
          const box = L.DomUtil.create('div', 'leaflet-control');
          box.innerHTML = legendHtml();
          L.DomEvent.disableClickPropagation(box);
          L.DomEvent.disableScrollPropagation(box);
          return box;
        },
      });
      map.addControl(new Legend());
      const details = els.map.querySelector('.legend');
      // 地圖夠大時預設展開；較窄的地圖（含手機）先收合，避免蓋住圓點
      if (details) details.open = els.map.clientWidth >= 720 && els.map.clientHeight >= 480;
    }

    /* 圖磚全數失敗（離線）時在地圖上提示 */
    function watchTiles(layer) {
      let loaded = 0;
      let failed = 0;
      let noticeShown = false;
      layer.on('tileload', () => {
        loaded += 1;
        if (noticeShown) {
          hideMapNotice();
          noticeShown = false;
        }
      });
      layer.on('tileerror', () => {
        failed += 1;
        if (!noticeShown && loaded === 0 && failed >= 4) {
          showMapNotice('底圖無法載入', '地圖圖磚無法下載（可能是離線）。專案位置、清單與報告不受影響。', false);
          noticeShown = true;
        }
      });
    }

    function observeSize() {
      if (!('ResizeObserver' in window)) return;
      let frame = 0;
      const observer = new ResizeObserver(() => {
        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(() => map.invalidateSize({ pan: false }));
      });
      observer.observe(els.map);
    }

    return { show, focus, setHot, applyTheme };
  }

  /* =========================================================
     9. 套用篩選（州別、狀態、時間窗、觀察名單、搜尋以 AND 組合）
     ========================================================= */
  function applyFilters(options) {
    const opts = options || {};
    visibleIds = new Set(RECS.filter(matches).map((r) => r.id));
    syncControls();
    updateList();
    els.count.innerHTML = `顯示 <b>${visibleIds.size}</b> / 共 <b>${RECS.length}</b> 筆`;
    if (opts.resetScroll && !MQ_NARROW.matches) els.listCol.scrollTop = 0;
    if (mapView) mapView.show(visibleIds, opts.fit ? filters.state : null);
    scheduleClampCheck();   // 剛顯示的卡片要重新判斷有沒有被截斷的文字
  }

  function syncControls() {
    els.stateTabs.querySelectorAll('[data-state]').forEach((b) => {
      b.setAttribute('aria-pressed', String(b.dataset.state === filters.state));
    });
    els.statusChips.querySelectorAll('[data-filter-status]').forEach((b) => {
      b.setAttribute('aria-pressed', String(filters.statuses.has(b.dataset.filterStatus)));
    });
    els.windowChips.querySelectorAll('[data-filter-window]').forEach((b) => {
      b.setAttribute('aria-pressed', String(filters.windows.has(b.dataset.filterWindow)));
    });
    els.watchChip.setAttribute('aria-pressed', String(filters.includeWatch));
    els.reset.disabled = filtersAreDefault();
  }

  function updateList() {
    cardEls.forEach((el, id) => { el.hidden = !visibleIds.has(id); });
    groupViews.forEach((g) => {
      const shown = g.ids.filter((id) => visibleIds.has(id)).map((id) => REC_BY_ID.get(id));
      const counts = tierCounts(shown);
      g.el.hidden = shown.length === 0;
      g.countEl.textContent = `${counts.main} 筆${counts.watch > 0 ? ` + ${counts.watch} 筆觀察名單` : ''}`;
    });

    const sel = filters.state;
    const selCounts = tierCounts(sel === 'ALL' ? RECS : (RECS_BY_STATE.get(sel) || []));
    const stateIsEmpty = sel !== 'ALL' && selCounts.total === 0;
    emptyStateEls.forEach((el, code) => { el.hidden = !(stateIsEmpty && code === sel); });

    const noMatch = visibleIds.size === 0 && !stateIsEmpty;
    byId('no-match').hidden = !noMatch;
    if (noMatch) {
      const watchOnlyHidden = sel !== 'ALL' && selCounts.main === 0 && selCounts.watch > 0 && !filters.includeWatch;
      byId('no-match-watch').hidden = !watchOnlyHidden;
      byId('no-match-text').textContent = noMatchText(sel, selCounts, watchOnlyHidden);
    }
    const zeroNote = byId('zero-note');
    if (zeroNote) zeroNote.hidden = sel !== 'ALL';
  }

  function noMatchText(sel, counts, watchOnlyHidden) {
    if (RECS.length === 0) return '資料中沒有任何專案。';
    if (watchOnlyHidden) return `${WATCH_ONLY_TEXT}。目前已關閉「含觀察名單」，開啟後可查看 ${counts.watch} 筆觀察名單。`;
    if (sel === 'ALL') return '沒有符合目前篩選條件的專案。';
    return `${stateName(sel)}有 ${counts.total} 筆專案，但都不符合目前的篩選條件。`;
  }

  /* =========================================================
     10. 互動：卡片 ↔ 地圖、定位、複製地址
     ========================================================= */
  function onMarkerClick(id) {
    selectCard(id, true);
  }

  function selectCard(id, scrollList) {
    if (selectedId && cardEls.has(selectedId)) cardEls.get(selectedId).classList.remove('is-selected');
    selectedId = id;
    const card = cardEls.get(id);
    if (!card) return;
    card.classList.add('is-selected');
    if (scrollList) scrollCardIntoList(card);
  }

  /* 只捲動右側清單欄；窄螢幕時清單不是捲動容器，就不動頁面，避免離開地圖 */
  function scrollCardIntoList(card) {
    const col = els.listCol;
    if (card.hidden || col.scrollHeight <= col.clientHeight + 1) return;
    const top = offsetWithin(card, col);
    const bottom = top + card.offsetHeight;
    if (top < col.scrollTop + 8 || bottom > col.scrollTop + col.clientHeight - 8) {
      col.scrollTo({ top: Math.max(0, top - 12), behavior: SCROLL_BEHAVIOR });
    }
  }

  function offsetWithin(el, ancestor) {
    let y = 0;
    let node = el;
    while (node && node !== ancestor) {
      y += node.offsetTop;
      node = node.offsetParent;
    }
    return y;
  }

  /* 「地圖定位」與「在地圖上看」：被篩選掉時先切到該州並清除其他篩選 */
  function locateRecord(id) {
    const r = REC_BY_ID.get(id);
    if (!r || !r.hasGeo || !mapView) return;
    if (!visibleIds.has(id)) {
      resetFilters(r.state);
      applyFilters({ fit: false });
    }
    selectCard(id, true);
    ensureMapInView();
    mapView.focus(id);
  }

  function ensureMapInView() {
    const rect = els.mapCol.getBoundingClientRect();
    const topLimit = MQ_NARROW.matches ? 0 : els.controls.getBoundingClientRect().bottom;
    const visible = Math.max(0, Math.min(rect.bottom, window.innerHeight) - Math.max(rect.top, topLimit));
    if (rect.height > 0 && visible / rect.height >= 0.85) return;
    const target = MQ_NARROW.matches
      ? rect.top + window.scrollY - 8
      : els.desk.getBoundingClientRect().top + window.scrollY;
    window.scrollTo({ top: Math.max(0, target), behavior: SCROLL_BEHAVIOR });
  }

  async function copyAddress(button) {
    const r = REC_BY_ID.get(button.dataset.id);
    if (!r || !r.address) return;
    const ok = await copyText(r.address);
    flashButton(button, ok ? '已複製' : '複製失敗', ok);
    els.srStatus.textContent = ok ? `已複製地址：${r.address}` : '無法存取剪貼簿，請手動選取地址文字複製。';
  }

  /* 優先用剪貼簿 API；不可用或被拒時改用隱藏 textarea + execCommand */
  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (err) {
        console.warn('剪貼簿 API 無法使用，改用備援方式：', err);
      }
    }
    const helper = document.createElement('textarea');
    helper.value = text;
    helper.setAttribute('readonly', '');
    helper.className = 'clip-helper';
    document.body.appendChild(helper);
    const previousFocus = document.activeElement;
    helper.select();
    let ok = false;
    try {
      ok = document.execCommand('copy');
    } catch (err) {
      console.warn('備援複製失敗：', err);
    }
    helper.remove();
    if (previousFocus && typeof previousFocus.focus === 'function') previousFocus.focus();
    return ok;
  }

  function flashButton(button, text, ok) {
    const label = button.querySelector('span');
    if (!label) return;
    if (!button.dataset.label) button.dataset.label = label.textContent;
    label.textContent = text;
    button.classList.toggle('is-done', ok);
    clearTimeout(Number(button.dataset.timer || 0));
    const timer = setTimeout(() => {
      label.textContent = button.dataset.label;
      button.classList.remove('is-done');
    }, 1600);
    button.dataset.timer = String(timer);
  }

  function hoverRecord(id) {
    if (mapView) mapView.setHot(id);
  }

  /* 卡片長文字（施工證據、可租說明、差異）：一個按鈕同時展開／收合三個欄位 */
  function toggleCardText(button) {
    const card = button.closest('.card');
    const expanded = !card.classList.contains('is-expanded');
    card.classList.toggle('is-expanded', expanded);
    button.setAttribute('aria-expanded', String(expanded));
    button.textContent = expanded ? '收合' : '展開';
    if (!expanded) scheduleClampCheck();   // 收合後確認是否仍有文字被截斷（視窗寬度可能已變）
  }

  /* 只有真的有文字被截斷的卡片才顯示「展開」；放得下的就不出現按鈕 */
  let clampFrame = 0;
  function scheduleClampCheck() {
    cancelAnimationFrame(clampFrame);
    clampFrame = requestAnimationFrame(updateClampToggles);
  }

  function updateClampToggles() {
    // 先讀完所有卡片的版面，再一次寫入，避免反覆強制重排；被篩掉（hidden）的卡片量不到，等顯示時再量
    const updates = [];
    cardEls.forEach((card) => {
      const button = card.querySelector('.card__more');
      if (!button || card.hidden) return;
      const truncated = card.classList.contains('is-expanded')
        || Array.from(card.querySelectorAll('.clamp')).some((el) => el.scrollHeight > el.clientHeight + 1);
      updates.push([button, truncated]);
    });
    updates.forEach(([button, show]) => { button.hidden = !show; });
  }

  /* 清單寬度或字型改變會影響換行，要重新判斷截斷 */
  function observeClampTriggers() {
    if ('ResizeObserver' in window) {
      let lastWidth = -1;
      new ResizeObserver((entries) => {
        const width = Math.round(entries[0].contentRect.width);
        if (width === lastWidth) return;
        lastWidth = width;
        scheduleClampCheck();
      }).observe(els.list);
    }
    if (document.fonts) {
      document.fonts.ready.then(scheduleClampCheck);
      document.fonts.addEventListener('loadingdone', scheduleClampCheck);
    }
  }

  function toggleInSet(set, value) {
    if (set.has(value)) set.delete(value);
    else set.add(value);
  }

  function onActionClick(ev) {
    const button = ev.target.closest('[data-action]');
    if (!button || button.disabled) return;
    const action = button.dataset.action;
    if (action === 'locate') {
      locateRecord(button.dataset.id);
    } else if (action === 'copy') {
      copyAddress(button);
    } else if (action === 'select-state') {
      filters.state = button.dataset.state;
      applyFilters({ fit: true, resetScroll: true });
      if (MQ_NARROW.matches) els.listCol.scrollIntoView({ block: 'start', behavior: SCROLL_BEHAVIOR });
    } else if (action === 'include-watch') {
      filters.includeWatch = true;
      applyFilters({ fit: true, resetScroll: true });
    } else if (action === 'reset') {
      resetFilters('ALL');
      applyFilters({ fit: true, resetScroll: true });
    } else if (action === 'toggle-card') {
      toggleCardText(button);
    }
  }

  function bindEvents() {
    els.stateTabs.addEventListener('click', (ev) => {
      const button = ev.target.closest('[data-state]');
      if (!button) return;
      filters.state = button.dataset.state;
      applyFilters({ fit: true, resetScroll: true });
    });
    els.statusChips.addEventListener('click', (ev) => {
      const button = ev.target.closest('[data-filter-status]');
      if (!button) return;
      toggleInSet(filters.statuses, button.dataset.filterStatus);
      applyFilters({ fit: true, resetScroll: true });
    });
    els.windowChips.addEventListener('click', (ev) => {
      const button = ev.target.closest('[data-filter-window]');
      if (!button) return;
      toggleInSet(filters.windows, button.dataset.filterWindow);
      applyFilters({ fit: true, resetScroll: true });
    });
    els.watchChip.addEventListener('click', () => {
      filters.includeWatch = !filters.includeWatch;
      applyFilters({ fit: true, resetScroll: true });
    });
    els.search.addEventListener('input', debounce(() => {
      setQuery(els.search.value);
      applyFilters({ fit: true, resetScroll: true });
    }, 250));
    els.reset.addEventListener('click', () => {
      resetFilters('ALL');
      applyFilters({ fit: true, resetScroll: true });
    });
    document.addEventListener('click', onActionClick);

    // 滑過或鍵盤聚焦卡片時標亮地圖上的圓點
    els.list.addEventListener('pointerover', (ev) => {
      if (ev.pointerType === 'touch') return;
      const card = ev.target.closest('.card');
      hoverRecord(card ? card.dataset.id : null);
    });
    els.list.addEventListener('pointerleave', () => hoverRecord(null));
    els.list.addEventListener('focusin', (ev) => {
      const card = ev.target.closest('.card');
      hoverRecord(card ? card.dataset.id : null);
    });
    els.list.addEventListener('focusout', (ev) => {
      if (!ev.relatedTarget || !els.list.contains(ev.relatedTarget)) hoverRecord(null);
    });

    els.themeToggle.addEventListener('click', (ev) => {
      const button = ev.target.closest('[data-theme-choice]');
      if (button) setThemeChoice(button.dataset.themeChoice);
    });
    MQ_DARK.addEventListener('change', () => {
      if (themeChoice() === 'auto') onThemeChange();
    });
    window.addEventListener('beforeprint', openDetailsForPrint);
    window.addEventListener('afterprint', restoreDetailsAfterPrint);
  }

  /* =========================================================
     11. 報告（完整資料，不受上方篩選影響）
     ========================================================= */
  const LOCATE_HEADER = '<span class="visually-hidden">在地圖上看</span>';
  const STATE_COLUMNS = [
    ['編號', 6.5], ['專案', 8.5], ['營運商', 7], ['街道地址', 10], ['容量 MW', 7.5], ['狀態', 8], ['分級', 7.5],
    ['施工證據', 10.5], ['預計完工', 8.5], ['可租判斷', 7.5], ['可信度', 4.5], ['來源', 7], [LOCATE_HEADER, 7, 'col-locate'],
  ];
  const WINDOW_COLUMNS = [
    ['編號', 7], ['專案', 15], ['營運商', 11], ['州', 8], ['容量 MW', 8], ['狀態', 13], ['預計完工', 14], ['判定依據', 14], ['可租判斷', 10],
  ];
  const CONFLICT_COLUMNS = [['編號', 9], ['專案', 22], ['州', 12], ['差異說明', 57]];
  const EXCLUDED_COLUMNS = [
    ['編號', 7], ['州', 9], ['專案', 15], ['營運商', 11], ['地址', 15], ['容量 MW', 7], ['原因', 12], ['說明', 14], ['來源', 10],
  ];

  function renderReport() {
    els.reportTitle.textContent = str(META.title_zh) || document.title;
    els.reportMeta.innerHTML = `資料日期 <span class="mono">${esc(META.generated) || '—'}</span>`
      + ` · 主清單 ${MAIN_RECS.length} 筆 · 觀察名單 ${WATCH_RECS.length} 筆 · 排除 ${EXCLUDED.length} 筆`;
    els.secSummary.innerHTML = summaryHtml();
    els.secFindings.innerHTML = findingsHtml();
    els.secWindows.innerHTML = windowsHtml();
    els.secStates.innerHTML = statesHtml();
    els.secConflicts.innerHTML = conflictsHtml();
    els.secCoverage.innerHTML = coverageHtml();
    els.secMethod.innerHTML = methodHtml();
    els.secExcluded.innerHTML = excludedHtml();
    els.foot.innerHTML = `${esc(META.title_zh)}${str(META.title_zh) ? ' · ' : ''}資料日期 <span class="mono">${esc(META.generated) || '—'}</span>`
      + ' · 地圖底圖 © Esri（Esri, HERE, Garmin, © OpenStreetMap contributors, and the GIS user community）';
  }

  function tableHtml(cls, columns, rowsHtml) {
    const head = columns.map(([label, width, colCls]) => `<th scope="col" style="width:${width}%"${colCls ? ` class="${colCls}"` : ''}>${label}</th>`).join('');
    return `<div class="table-wrap"><table class="dtable ${cls}"><thead><tr>${head}</tr></thead><tbody>${rowsHtml}</tbody></table></div>`;
  }

  function listOrNa(items, emptyText) {
    if (items.length === 0) return `<p class="na">${esc(emptyText)}</p>`;
    return `<ul>${items.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>`;
  }

  function idLink(r) {
    return `<a class="mono" href="#row-${domId(r.id)}">${esc(r.id)}</a>`;
  }

  /* --- 01 摘要 --- */
  function summaryHtml() {
    const headline = str(NARRATIVE.headline);
    const paragraphs = strList(NARRATIVE.summary_paragraphs);
    if (!headline && paragraphs.length === 0) return '<p class="na">（摘要尚未提供）</p>';
    return `${headline ? `<p class="lead">${esc(headline)}</p>` : ''}<div class="prose">${paragraphs.map((p) => `<p>${esc(p)}</p>`).join('')}</div>`;
  }

  /* --- 02 重點發現 --- */
  function findingsHtml() {
    const items = asArray(NARRATIVE.key_findings)
      .map((f) => (typeof f === 'string' ? { title: '', body: str(f) } : { title: str(f && f.title), body: str(f && f.body) }))
      .filter((f) => f.title || f.body);
    if (items.length === 0) return '<p class="na">（重點發現尚未提供）</p>';
    return `<ol class="findings">${items.map((f, i) => `<li class="finding">
      <span class="finding__num">${String(i + 1).padStart(2, '0')}</span>
      ${f.title ? `<h3>${esc(f.title)}</h3>` : ''}${f.body ? `<p>${esc(f.body)}</p>` : ''}
    </li>`).join('')}</ol>`;
  }

  /* --- 03 完工時間窗 --- */
  function windowsHtml() {
    const notes = strList(NARRATIVE.window_notes);
    const notesHtml = notes.length > 0 ? `<ul class="notes">${notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>` : '';
    const blocks = WINDOW_ORDER.map((key) => {
      const list = RECS.filter((r) => r.windowKey === key);
      const body = list.length === 0
        ? '<p class="na">此時間窗目前沒有專案。</p>'
        : tableHtml('dtable--window', WINDOW_COLUMNS, list.map(windowRowHtml).join(''));
      return `<div class="sub-head" id="window-${domId(key)}"><h3>${esc(WINDOW_ZH[key])}</h3><span class="stats">${groupStats(list)}</span></div>${body}`;
    });
    return notesHtml + blocks.join('');
  }

  function windowRowHtml(r) {
    const tier = r.isWatch ? `<div>${tierBadge()}</div>${r.tier_reason ? `<div class="sub">${esc(r.tier_reason)}</div>` : ''}` : '';
    return `<tr${r.isWatch ? ' class="is-watch"' : ''}>
      <td class="nowrap">${idLink(r)}</td>
      <td class="t-name">${esc(r.project_name) || na('（未命名專案）')}</td>
      <td>${esc(r.operator) || na()}</td>
      <td>${esc(stateName(r.state))}</td>
      <td>${capacityShort(r)}</td>
      <td>${statusPill(r.status)}${tier}</td>
      <td>${esc(r.expected_completion) || na('未公布')}${r.completion_source ? `<div class="sub">來源：${esc(r.completion_source)}</div>` : ''}</td>
      <td>${esc(r.window_basis) || na()}</td>
      <td>${esc(leasableZh(r.leasable))}</td>
    </tr>`;
  }

  /* 分組統計：主清單筆數、觀察名單筆數、主清單已知容量 */
  function groupStats(list) {
    if (list.length === 0) return '0 筆';
    const main = list.filter((r) => !r.isWatch);
    const watchCount = list.length - main.length;
    const parts = [`主清單 ${main.length} 筆`];
    if (watchCount > 0) parts.push(`觀察名單 ${watchCount} 筆`);
    if (main.length > 0) parts.push(`已知容量 <span class="mono">${fmtMW(sumMW(main))}</span> MW`);
    return parts.join(' · ');
  }

  /* --- 04 各州盤點 --- */
  function statesHtml() {
    const blocks = STATES.map((s) => stateBlockHtml(s.code, s.name_zh, RECS_BY_STATE.get(s.code), s));
    if (ORPHAN_RECS.length > 0) blocks.push(stateBlockHtml('OTHER', '州別不明', ORPHAN_RECS, null));
    return blocks.join('');
  }

  function stateBlockHtml(code, name, list, state) {
    const main = list.filter((r) => !r.isWatch);
    const extra = main.length > 0
      ? ` · 施工中 ${main.filter((r) => r.status === 'under_construction').length}`
        + (main.some((r) => r.capacity_mw === null) ? ` · ${main.filter((r) => r.capacity_mw === null).length} 筆容量未公布` : '')
      : '';
    const head = `<div class="sub-head" id="state-${domId(code)}"><h3>${esc(name)}${code === 'OTHER' ? '' : `<span class="code">${esc(code)}</span>`}</h3>`
      + `<span class="stats">${groupStats(list)}${extra}</span></div>`;
    if (list.length === 0) return head + emptyStateHtml(state, 'report');
    const watchOnly = main.length === 0 ? `<p class="note-watch"><strong>${WATCH_ONLY_TEXT}</strong></p>` : '';
    return head + watchOnly + tableHtml('dtable--state', STATE_COLUMNS, list.map(stateRowHtml).join(''));
  }

  function stateRowHtml(r) {
    return `<tr id="row-${domId(r.id)}"${r.isWatch ? ' class="is-watch"' : ''}>
      <td class="mono nowrap">${esc(r.id)}</td>
      <td><span class="t-name">${esc(r.project_name) || na('（未命名專案）')}</span>${r.developer_owner ? `<div class="sub">開發／持有：${esc(r.developer_owner)}</div>` : ''}</td>
      <td>${esc(r.operator) || na()}</td>
      <td>${addressCell(r)}</td>
      <td>${capacityCell(r)}</td>
      <td>${statusCell(r)}</td>
      <td>${tierCell(r)}</td>
      <td>${esc(r.construction_evidence) || na()}${r.construction_start ? `<div class="sub">開工 <span class="mono">${esc(r.construction_start)}</span></div>` : ''}</td>
      <td>${completionCell(r)}</td>
      <td>${leasableCell(r)}</td>
      <td>${confidenceHtml(r.confidence, false)}</td>
      <td>${sourcesCell(r)}</td>
      <td class="col-locate">${locateButton(r, '在地圖上看', false)}</td>
    </tr>`;
  }

  function addressCell(r) {
    const ring = r.isApprox ? '<span class="dash-ring" aria-hidden="true"></span> ' : '';
    const precision = r.geo.precision ? `<div class="sub">${ring}座標精度：${esc(precisionZh(r.geo.precision))}</div>` : '';
    const notes = r.address_notes ? `<div class="sub">${esc(r.address_notes)}</div>` : '';
    return `<span class="selectable">${esc(r.address) || na('地址未公布')}</span>${precision}${notes}`;
  }

  function capacityShort(r) {
    if (r.capacity_mw === null) return na('未公布');
    return `<span class="mono">${fmtMW(r.capacity_mw)}</span><div class="sub">${esc(basisZh(r.capacity_basis))}</div>`;
  }

  function capacityCell(r) {
    const notes = r.capacity_notes ? `<div class="sub">${esc(r.capacity_notes)}</div>` : '';
    if (r.capacity_mw === null) return `${na('容量未公布')}${notes}`;
    const phase = r.first_phase_mw !== null ? `<div class="sub">首期 <span class="mono">${fmtMW(r.first_phase_mw)}</span> MW</div>` : '';
    return `${capacityShort(r)}${phase}${notes}`;
  }

  function statusCell(r) {
    const date = r.status_date ? `<div class="sub mono">${esc(r.status_date)}</div>` : '';
    const ref = r.approval_ref ? `<div class="sub">核准編號 <span class="mono">${esc(r.approval_ref)}</span></div>` : '';
    return `${statusPill(r.status)}${date}${ref}`;
  }

  function tierCell(r) {
    if (!r.isWatch) return `<span class="tier-main">${TIER_ZH.main}</span>`;
    return `${tierBadge()}${r.tier_reason ? `<div class="sub">${esc(r.tier_reason)}</div>` : ''}`;
  }

  function completionCell(r) {
    const source = r.completion_source ? `<div class="sub">來源：${esc(r.completion_source)}</div>` : '';
    return `${esc(r.expected_completion) || na('未公布')}${source}<div class="sub">時間窗：${esc(WINDOW_ZH[r.windowKey])}</div>`;
  }

  function leasableCell(r) {
    const note = r.leasable_note ? `<div class="sub">${esc(r.leasable_note)}</div>` : '';
    const tenants = r.known_tenants ? `<div class="sub">已知租戶：${esc(r.known_tenants)}</div>` : '';
    return `${esc(leasableZh(r.leasable))}${note}${tenants}`;
  }

  /* 報告中列出全部來源連結：類別一行、網域一行 */
  function sourcesCell(r) {
    const items = [];
    [['政府', r.gov_urls], ['營運商', r.operator_urls], ['媒體', r.press_urls]].forEach(([label, urls]) => {
      urls.forEach((url) => items.push(sourceLinkHtml(url, label)));
    });
    return items.length > 0 ? `<div class="src-list">${items.join('')}</div>` : na('無');
  }

  /* 網域在每個「.」後面允許換行，窄欄位裡不會從字中間斷開 */
  function sourceLinkHtml(url, label) {
    const href = safeUrl(url);
    const host = href ? hostOf(href) : str(url);
    const inner = `<span class="src__label">${esc(label)}</span><span class="src__host">${host.split('.').map((part) => esc(part)).join('.<wbr>')}</span>`;
    if (!href) return `<span class="src na" title="不是有效的網址">${inner}</span>`;
    return `<a class="src" href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="${esc(href)}">${inner}</a>`;
  }

  /* --- 05 差異與待確認 --- */
  function conflictsHtml() {
    const flagged = RECS.filter((r) => r.conflicts);
    if (CONFLICTS.length === 0 && flagged.length === 0) return '<p class="na">本次未記錄來源之間的差異。</p>';
    let html = '';
    if (CONFLICTS.length > 0) html += `<ul class="conflicts">${CONFLICTS.map(conflictItemHtml).join('')}</ul>`;
    if (flagged.length > 0) {
      const rows = flagged.map((r) => `<tr${r.isWatch ? ' class="is-watch"' : ''}>
        <td>${idLink(r)}</td>
        <td><span class="t-name">${esc(r.project_name) || na('（未命名專案）')}</span>${r.isWatch ? `<div>${tierBadge()}</div>` : ''}</td>
        <td>${esc(stateName(r.state))}</td>
        <td>${esc(r.conflicts)}</td>
      </tr>`).join('');
      html += `<div class="sub-head"><h3>專案記錄中的差異註記</h3><span class="stats">${flagged.length} 筆</span></div>`
        + tableHtml('dtable--conflicts', CONFLICT_COLUMNS, rows);
    }
    return html;
  }

  function conflictItemHtml(c) {
    const refs = c.record_ids.map((id) => {
      const r = REC_BY_ID.get(id);
      return r ? `<a href="#row-${domId(id)}">${esc(id)} ${esc(r.project_name)}</a>` : `<span>${esc(id)}</span>`;
    });
    return `<li class="conflict">${c.topic ? `<h3>${esc(c.topic)}</h3>` : ''}${c.detail ? `<p>${esc(c.detail)}</p>` : ''}`
      + `${refs.length > 0 ? `<p class="refs">相關專案：${refs.join('、')}</p>` : ''}</li>`;
  }

  /* --- 06 搜尋範圍與缺口 --- */
  function coverageHtml() {
    const blocks = STATES.map((s) => {
      const counts = tierCounts(RECS_BY_STATE.get(s.code));
      const agents = s.agents.length > 0 ? s.agents.map((a) => `<span class="mono nowrap">${esc(a)}</span>`).join('、') : '—';
      return `<div class="cov">
        <h3>${esc(s.name_zh)}<span class="code">${esc(s.code)}</span></h3>
        <p class="cov__meta">主清單 ${counts.main} 筆${counts.watch > 0 ? ` · 觀察名單 ${counts.watch} 筆` : ''}</p>
        <p class="cov__meta">負責代理：${agents}</p>
        ${bulletBlock('搜尋紀錄', s.search_log, 'h4', '')}
        ${bulletBlock('缺口', s.gaps, 'h4', '')}
        ${s.agent_notes.length > 0 ? bulletBlock('備註', s.agent_notes, 'h4', '') : ''}
      </div>`;
    });
    return `<div class="coverage">${blocks.join('')}</div>`;
  }

  /* --- 07 方法與判斷準則 --- */
  function methodHtml() {
    return `<div class="two-col">
      <div><h3>方法</h3>${listOrNa(strList(NARRATIVE.method), '（尚未提供）')}</div>
      <div><h3>注意事項</h3>${listOrNa(strList(NARRATIVE.caveats), '（尚未提供）')}</div>
    </div>`;
  }

  /* --- 08 排除清單（預設收合） --- */
  function excludedHtml() {
    if (EXCLUDED.length === 0) return '<p class="na">本次沒有排除項目。</p>';
    const counts = new Map();
    EXCLUDED.forEach((e) => counts.set(e.reason, (counts.get(e.reason) || 0) + 1));
    const keys = EXCLUDED_REASON_ORDER.filter((k) => counts.has(k))
      .concat(Array.from(counts.keys()).filter((k) => !EXCLUDED_REASON_ORDER.includes(k)));
    const countItems = keys.map((key) => `<li>${esc(reasonLabel(key))}<b>${counts.get(key)}</b></li>`).join('');
    const rows = EXCLUDED.map(excludedRowHtml).join('');
    return `<p class="section-note">排除項目不會出現在地圖上，列出來是為了說明搜尋涵蓋的範圍。</p>
      <details class="excluded">
        <summary><span class="when-closed">展開</span><span class="when-open">收合</span>排除清單（共 ${EXCLUDED.length} 筆）</summary>
        <ul class="reason-counts">${countItems}</ul>
        ${tableHtml('dtable--excluded', EXCLUDED_COLUMNS, rows)}
      </details>`;
  }

  function reasonLabel(key) {
    if (EXCLUDED_REASON_ZH[key]) return EXCLUDED_REASON_ZH[key];
    const sample = EXCLUDED.find((e) => e.reason === key && e.reason_zh);
    return sample ? sample.reason_zh : key;
  }

  function excludedRowHtml(e) {
    const links = e.urls.map((url, i) => sourceLinkHtml(url, `來源 ${i + 1}`));
    return `<tr>
      <td class="mono nowrap">${esc(e.id)}</td>
      <td>${esc(stateName(e.state))}</td>
      <td class="t-name">${esc(e.project_name) || na()}</td>
      <td>${esc(e.operator) || na()}</td>
      <td>${esc(e.address) || na()}</td>
      <td>${e.capacity_mw === null ? na() : `<span class="mono">${fmtMW(e.capacity_mw)}</span>`}</td>
      <td>${esc(e.reason_zh || reasonLabel(e.reason))}</td>
      <td>${esc(e.note) || na()}</td>
      <td>${links.length > 0 ? `<div class="src-list">${links.join('')}</div>` : na('無')}</td>
    </tr>`;
  }

  /* =========================================================
     12. 主題、列印、版面量測
     ========================================================= */
  function themeChoice() {
    const t = document.documentElement.getAttribute('data-theme');
    return t === 'light' || t === 'dark' ? t : 'auto';
  }

  function effectiveTheme() {
    const choice = themeChoice();
    if (choice !== 'auto') return choice;
    return MQ_DARK.matches ? 'dark' : 'light';
  }

  function setThemeChoice(choice) {
    document.documentElement.setAttribute('data-theme', choice);
    els.themeToggle.querySelectorAll('[data-theme-choice]').forEach((b) => {
      b.setAttribute('aria-pressed', String(b.dataset.themeChoice === choice));
    });
    onThemeChange();
  }

  function onThemeChange() {
    tokenCache.clear();
    if (mapView) mapView.applyTheme();
  }

  /* 列印時展開報告內收合的區塊（排除清單），印完還原 */
  function openDetailsForPrint() {
    document.querySelectorAll('.report details').forEach((d) => {
      d.dataset.wasOpen = d.open ? '1' : '0';
      d.open = true;
    });
  }

  function restoreDetailsAfterPrint() {
    document.querySelectorAll('.report details[data-was-open]').forEach((d) => {
      d.open = d.dataset.wasOpen === '1';
      delete d.dataset.wasOpen;
    });
  }

  /* 控制列高度寫入 --strip-h，地圖高度 = 視窗高度 − 控制列 */
  function observeStrip() {
    const update = () => {
      document.documentElement.style.setProperty('--strip-h', `${els.controls.offsetHeight}px`);
    };
    update();
    if ('ResizeObserver' in window) new ResizeObserver(update).observe(els.controls);
  }

  function disableMapButtons() {
    document.querySelectorAll('[data-action="locate"]').forEach((b) => {
      b.disabled = true;
      b.title = '地圖無法載入';
    });
  }

  /* =========================================================
     13. 啟動：先畫清單與報告，最後才建地圖（地圖失敗不影響其他部分）
     ========================================================= */
  renderTopbar();
  renderControls();
  renderList();
  renderReport();
  bindEvents();
  observeStrip();
  observeClampTriggers();
  try {
    mapView = createMapView();
  } catch (err) {
    console.error('地圖初始化失敗：', err);
    showMapNotice('地圖無法使用', `地圖初始化失敗（${err.message}）。專案清單與下方報告仍可正常使用。`, true);
    mapView = null;
  }
  if (!mapView) disableMapButtons();
  applyFilters({ fit: false });

})();
</script>
</body>
</html>
